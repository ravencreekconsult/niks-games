<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>DUCK HUNT — Retro Modern</title>
<style>
  :root{
    --ink:#e9f2ff; --dim:#8fa3c0; --hi:#ffd34d; --danger:#ff5a5a; --ok:#6dffa1;
    --chrome1:#151a24; --chrome2:#0a0d13; --edge:#39445a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; background:#05070b; overflow:hidden;
    color:var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  body{ display:flex; align-items:center; justify-content:center; }
  #wrap{ position:relative; width:100vw; height:100vh; max-width:1100px; max-height:100vh;
    display:flex; flex-direction:column; background:#05070b; overflow:hidden; }
  #stage{ position:relative; flex:1 1 auto; min-height:0; display:block; }
  #cv{ display:block; width:100%; height:100%; background:#0a1020; touch-action:none;
    image-rendering:auto; cursor:crosshair; }
  #stage::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, rgba(255,255,255,0.00) 2px, rgba(255,255,255,0.00) 3px);
    mix-blend-mode:multiply; opacity:.55; }
  #vig{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 100%); }
  /* ---- HUD ---- */
  #hud{ position:absolute; top:0; left:0; right:0; z-index:5; pointer-events:none;
    display:flex; flex-wrap:wrap; gap:4px 6px; padding:6px 8px;
    text-transform:uppercase; letter-spacing:.06em; font-size:clamp(9px,2.5vw,13px); font-weight:700; }
  .chip{ background:linear-gradient(180deg,var(--chrome1),var(--chrome2));
    border:2px solid var(--edge); border-radius:6px; padding:2px 7px; line-height:1.5;
    box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.07); color:var(--dim); white-space:nowrap; }
  .chip b{ color:var(--ink); font-weight:800; }
  .chip .k{ color:var(--dim); }
  #scoreChip b{ color:var(--hi); text-shadow:0 0 8px rgba(255,211,77,.6); }
  #bestChip b{ color:var(--ok); }
  /* ---- controls ---- */
  #controls{ flex:0 0 auto; display:flex; gap:6px; padding:8px; flex-wrap:wrap;
    background:linear-gradient(180deg,#0b0f16,#05070b); border-top:3px solid var(--edge); }
  button{ flex:1 1 0; min-height:46px; min-width:76px; border-radius:9px; cursor:pointer;
    font-family:inherit; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
    font-size:clamp(10px,2.6vw,13px); color:var(--ink);
    background:linear-gradient(180deg,#2a3448,#141a26);
    border:2px solid var(--edge); box-shadow:0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,.10);
    transition:transform .05s ease, filter .1s ease; }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 #000; filter:brightness(1.15); }
  #startBtn{ background:linear-gradient(180deg,#ff8a2b,#c65a05); border-color:#ffcf8a;
    color:#200d00; text-shadow:0 1px 0 rgba(255,255,255,.25); }
  #muteBtn{ flex:0 0 auto; min-width:64px; }
  button:disabled{ opacity:.4; filter:grayscale(.6); }
  /* ---- overlay ---- */
  #msg{ position:absolute; inset:0; z-index:9; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:10px; padding:18px;
    background:rgba(5,8,14,.78); backdrop-filter:blur(2px); }
  #msgTitle{ font-size:clamp(24px,8vw,58px); font-weight:900; letter-spacing:.05em;
    text-transform:uppercase; color:var(--hi);
    text-shadow:0 3px 0 #7a4a00, 0 0 22px rgba(255,211,77,.65); }
  #msgText{ max-width:34ch; font-size:clamp(11px,3.2vw,16px); line-height:1.5; color:var(--dim);
    text-transform:uppercase; letter-spacing:.06em; }
  #msgBtn{ flex:0 0 auto; min-width:190px; max-width:70%; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="cv" width="640" height="400"></canvas>
      <div id="vig"></div>
      <div id="hud">
        <span class="chip" id="scoreChip"><span class="k">SCORE</span> <b id="score">0</b></span>
        <span class="chip" id="bestChip"><span class="k">BEST</span> <b id="best">0</b></span>
        <span class="chip"><span class="k">ROUND</span> <b id="round">1</b></span>
        <span class="chip"><span class="k">DUCKS</span> <b id="ducks">10</b></span>
        <span class="chip"><span class="k">SHELLS</span> <b id="shells">3</b></span>
        <span class="chip"><span class="k">GUN</span> <b id="gun">12-Gauge</b></span>
        <span class="chip"><span class="k">AREA</span> <b id="scene">Sunny Meadow</b></span>
        <span class="chip"><span class="k">DIFF</span> <b id="diff">Normal</b></span>
      </div>
      <div id="msg">
        <div id="msgTitle">DUCK HUNT</div>
        <div id="msgText">TAP TO SHOOT · CLEAR 10 DUCKS A ROUND</div>
        <button id="msgBtn">START HUNT</button>
      </div>
    </div>
    <div id="controls">
      <button id="startBtn">START</button>
      <button id="gunBtn">GUN: 12-Gauge</button>
      <button id="diffBtn">DIFF: Normal</button>
      <button id="muteBtn">SOUND: OFF</button>
    </div>
  </div>
<script>
(function(){
'use strict';

/* =========================================================================
   DUCK HUNT — retro-modern, single-file, procedurally drawn.
   Logical resolution fixed at 640x400; canvas scales to fit.
   ========================================================================= */

var VW = 640, VH = 400, HORIZON = 250;
var ROUNDS_TO_WIN = 15;

function E(id){ return document.getElementById(id); }

var cv = E('cv');
var ctx = (cv && cv.getContext) ? cv.getContext('2d') : null;

var elScore=E('score'), elBest=E('best'), elRound=E('round'), elDucks=E('ducks'),
    elShells=E('shells'), elGun=E('gun'), elScene=E('scene'), elDiff=E('diff'),
    elMsg=E('msg'), elMsgTitle=E('msgTitle'), elMsgText=E('msgText'), elMsgBtn=E('msgBtn'),
    elStart=E('startBtn'), elGunBtn=E('gunBtn'), elDiffBtn=E('diffBtn'), elMute=E('muteBtn');

/* ---------------- math utils ---------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function hex2rgb(h){ return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]; }
function makeBands(top,bot,n){
  var A=hex2rgb(top), B=hex2rgb(bot), out=[];
  for(var i=0;i<n;i++){
    var t=i/(n-1);
    out.push('rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')');
  }
  return out;
}

/* ---------------- persistent save ---------------- */
var SAVE_KEY='duckhunt_save_v1';
var save={ best:0, guns:[true,true,true,false] };
function loadSave(){
  try{
    if(typeof localStorage!=='undefined' && localStorage){
      var raw=localStorage.getItem(SAVE_KEY);
      if(raw){ var o=JSON.parse(raw);
        if(o && typeof o==='object'){
          if(typeof o.best==='number' && isFinite(o.best)) save.best=o.best;
          if(o.guns && o.guns.length===4) save.guns=o.guns;
        }
      }
    }
  }catch(e){}
}
function writeSave(){
  try{ if(typeof localStorage!=='undefined' && localStorage){ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } }catch(e){}
}

/* ---------------- audio (guarded, muted by default) ---------------- */
var AC=null, muted=true;
function getAC(){
  if(muted) return null;
  try{
    if(!AC){
      var C=(typeof AudioContext!=='undefined')?AudioContext:(typeof webkitAudioContext!=='undefined'?webkitAudioContext:null);
      if(!C) return null;
      AC=new C();
    }
    return AC;
  }catch(e){ return null; }
}
function tone(f0,f1,dur,type,vol){
  var a=getAC(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'square';
    var t=a.currentTime;
    o.frequency.setValueAtTime(f0,t);
    if(f1 && f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol||0.07,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function sndShot(){ tone(220,40,0.16,'square',0.09); tone(90,30,0.22,'sawtooth',0.06); }
function sndQuack(){ tone(420,180,0.10,'sawtooth',0.07); }
function sndReload(){ tone(180,320,0.05,'square',0.05); }
function sndPower(){ tone(700,1400,0.16,'square',0.07); }
function sndJingle(){
  var n=[523,659,784,1046]; 
  for(var i=0;i<n.length;i++){ (function(f,i){ setTimeout(function(){ tone(f,f,0.16,'square',0.08); }, i*130); })(n[i],i); }
}
function sndLose(){ tone(300,60,0.55,'sawtooth',0.09); }

/* ---------------- configuration ---------------- */
var GUNS=[
  { name:'12-Gauge',  shells:3, spread:30, pellets:6, points:100, fireRate:330, unlock:true,  body:'#8a5a2b', metal:'#c9d2dd', muzzle:'#ffd27a' },
  { name:'Rifle',     shells:1, spread:5,  pellets:1, points:300, fireRate:820, unlock:true,  body:'#6b3f1d', metal:'#e6eef7', muzzle:'#fff1c0' },
  { name:'Auto-12',   shells:4, spread:44, pellets:9, points:60,  fireRate:150, unlock:true,  body:'#2f3138', metal:'#9aa4b2', muzzle:'#ffbe63' },
  { name:'Golden Gun',shells:3, spread:14, pellets:7, points:200, fireRate:290, unlock:false, body:'#d4af37', metal:'#fff2b0', muzzle:'#ffe071' }
];
var DIFFS=[
  { name:'Easy',   spd:0.82, thr:6, mul:1.0 },
  { name:'Normal', spd:1.0,  thr:7, mul:1.25 },
  { name:'Hard',   spd:1.35, thr:8, mul:1.7 }
];

/* ---------------- scenes ---------------- */
var SCENES=[
  { name:'Sunny Meadow', top:'#1f66d6', bot:'#cfeaff', ground:'#3f9a3f', ground2:'#2b6f2b', water:false, weather:'clouds',
    tint:'#7fd06a' },
  { name:'Marsh at Dusk', top:'#241a44', bot:'#ff9a3c', ground:'#2c3a2a', ground2:'#1b2a1c', water:true, weather:'fireflies',
    tint:'#ffb15a' },
  { name:'Alpine Lake', top:'#33286a', bot:'#ffd9e8', ground:'#4a5a72', ground2:'#33405a', water:true, weather:'birds',
    tint:'#ffc7dd' },
  { name:'Canyon Sunset', top:'#4a1230', bot:'#ff7a24', ground:'#8a3a1e', ground2:'#5c2412', water:false, weather:'dust',
    tint:'#ff8a3c' },
  { name:'Snowy Pines', top:'#1d2a45', bot:'#cfe0ff', ground:'#eef4ff', ground2:'#c6d4ea', water:false, weather:'snow',
    tint:'#a9c7ff' }
];
for(var si=0; si<SCENES.length; si++){ SCENES[si].bands = makeBands(SCENES[si].top, SCENES[si].bot, 48); }

/* ---------------- game state ---------------- */
var state='title';         // title | playing | roundClear | gameover | win
var score=0, best=0, round=1, gunIndex=0, diffIndex=1, sceneIndex=0;
var ducks=[], falling=[], particles=[], popups=[], powerups=[], weather=[];
var ducksDown=0, roundAttempts=0, roundTarget=10;
var shellsLeft=3, spawnTimer=500, roundClearTimer=0, introT=0;
var combo=0, comboTimer=0, shake=0, muzzle=0, recoil=0, fireCd=0;
var slowT=0, dblT=0;
var dogState='idle', dogT=0, dogDuck=null;
var cross={ x:VW/2, y:VH/2-30, pulse:0 };
var duckColors=[ ['#7a4a1e','#5c3412','#3a2210'], ['#2f4f6a','#1e3648','#122532'], ['#6a2f2f','#4a1e1e','#301010'] ];
var tGlobal=0;

/* ---------------- layout ---------------- */
function resize(){
  var r=null;
  try{ if(cv.getBoundingClientRect) r=cv.getBoundingClientRect(); }catch(e){}
  var cw=(r&&isFinite(r.width)&&r.width>0)?r.width:VW;
  var ch=(r&&isFinite(r.height)&&r.height>0)?r.height:VH;
  var dpr=(typeof devicePixelRatio!=='undefined' && devicePixelRatio)?devicePixelRatio:1;
  if(dpr>2) dpr=2;
  var w=Math.max(1,Math.round(cw*dpr)), h=Math.max(1,Math.round(ch*dpr));
  if(w!==cv.width) cv.width=w;
  if(h!==cv.height) cv.height=h;
}
function toLocal(clientX,clientY){
  var r=null;
  try{ if(cv.getBoundingClientRect) r=cv.getBoundingClientRect(); }catch(e){}
  var l=(r&&isFinite(r.left))?r.left:0, t=(r&&isFinite(r.top))?r.top:0;
  var w=(r&&isFinite(r.width)&&r.width>0)?r.width:VW;
  var h=(r&&isFinite(r.height)&&r.height>0)?r.height:VH;
  return { x:(clientX-l)*VW/w, y:(clientY-t)*VH/h };
}

/* ---------------- HUD ---------------- */
function updateHud(){
  if(elScore) elScore.textContent=String(score);
  if(elBest)  elBest.textContent=String(best);
  if(elRound) elRound.textContent=String(round);
  if(elDucks) elDucks.textContent=String(Math.max(0, roundTarget-roundAttempts));
  if(elShells) elShells.textContent=String(shellsLeft);
  if(elGun) elGun.textContent=GUNS[gunIndex].name;
  if(elScene) elScene.textContent=SCENES[sceneIndex].name;
  if(elDiff) elDiff.textContent=DIFFS[diffIndex].name;
  if(elGunBtn) elGunBtn.textContent='GUN: '+GUNS[gunIndex].name;
  if(elDiffBtn) elDiffBtn.textContent='DIFF: '+DIFFS[diffIndex].name;
  if(elMute) elMute.textContent=muted?'SOUND: OFF':'SOUND: ON';
}
function showOverlay(title,text,btn){
  if(elMsgTitle) elMsgTitle.textContent=title;
  if(elMsgText) elMsgText.textContent=text;
  if(elMsgBtn) elMsgBtn.textContent=btn;
  if(elMsg) elMsg.style.display='flex';
}
function hideOverlay(){ if(elMsg) elMsg.style.display='none'; }

/* ---------------- scenes / weather ---------------- */
function sceneForRound(r){ return Math.floor((r-1)/3) % SCENES.length; }
function initWeather(){
  weather=[]; var i;
  var kind=SCENES[sceneIndex].weather, n;
  if(kind==='clouds'){ n=6; for(i=0;i<n;i++) weather.push({x:Math.random()*VW,y:30+Math.random()*90,vx:0.006+Math.random()*0.012,s:26+Math.random()*34,a:0.5+Math.random()*0.4}); }
  else if(kind==='fireflies'){ n=26; for(i=0;i<n;i++) weather.push({x:Math.random()*VW,y:HORIZON-70+Math.random()*120,vx:(Math.random()-0.5)*0.02,vy:(Math.random()-0.5)*0.02,s:2+Math.random()*2,a:0.3+Math.random()*0.7,p:Math.random()*6.28}); }
  else if(kind==='birds'){ n=7; for(i=0;i<n;i++) weather.push({x:Math.random()*VW,y:40+Math.random()*80,vx:0.03+Math.random()*0.05,s:3+Math.random()*3,a:0.4}); }
  else if(kind==='dust'){ n=40; for(i=0;i<n;i++) weather.push({x:Math.random()*VW,y:60+Math.random()*(HORIZON-40),vx:0.02+Math.random()*0.05,vy:(Math.random()-0.5)*0.01,s:1+Math.random()*2,a:0.2+Math.random()*0.5}); }
  else { n=70; for(i=0;i<n;i++) weather.push({x:Math.random()*VW,y:Math.random()*VH,vx:(Math.random()-0.5)*0.02,vy:0.03+Math.random()*0.05,s:1+Math.random()*2.4,a:0.5+Math.random()*0.5}); }
}
function updateWeather(dt){
  var kind=SCENES[sceneIndex].weather;
  for(var i=0;i<weather.length;i++){
    var p=weather[i];
    p.x+=p.vx*dt;
    if(kind==='snow'||kind==='dust'||kind==='fireflies') p.y+=p.vy*dt;
    if(kind==='fireflies'){ p.p+=dt*0.002; }
    if(p.x<-40) p.x=VW+40; if(p.x>VW+40) p.x=-40;
    if(kind==='snow' && p.y>VH+4){ p.y=-4; p.x=Math.random()*VW; }
    if(kind==='dust' && p.y>HORIZON){ p.y=60+Math.random()*40; }
  }
}
function setScene(idx,intro){
  sceneIndex=idx%SCENES.length;
  initWeather();
  if(intro){ introT=1500; }
}

/* ---------------- particles / juice ---------------- */
function feathers(x,y,cols,n){
  n=n||14;
  for(var i=0;i<n;i++){
    particles.push({ x:x, y:y, vx:(Math.random()-0.5)*0.28, vy:-0.05-Math.random()*0.22,
      g:0.00045, t:0, life:700+Math.random()*500, s:2+Math.random()*3, c:cols[(Math.random()*cols.length)|0], rot:Math.random()*6.28, kind:'feather' });
  }
}
function splash(x,y){
  for(var i=0;i<16;i++){
    particles.push({ x:x, y:y, vx:(Math.random()-0.5)*0.34, vy:-0.12-Math.random()*0.30,
      g:0.0011, t:0, life:500+Math.random()*350, s:1.5+Math.random()*2.5, c:'#cfefff', rot:0, kind:'drop' });
  }
}
function sparkles(x,y,color){
  for(var i=0;i<18;i++){
    particles.push({ x:x, y:y, vx:(Math.random()-0.5)*0.32, vy:(Math.random()-0.5)*0.32,
      g:0.0002, t:0, life:450+Math.random()*400, s:1.5+Math.random()*2.5, c:color, rot:0, kind:'spark' });
  }
}
function popText(x,y,txt,col){ popups.push({ x:x, y:y, txt:txt, t:0, life:850, col:col||'#ffe58a' }); }

/* ---------------- ducks ---------------- */
function spawnDuck(force){
  var fromLeft=Math.random()<0.5;
  var lb = 78, hb = HORIZON-24;
  var y = lb + Math.random()*(hb-lb);
  var baseSpd = 0.098 * DIFFS[diffIndex].spd * (1 + (round-1)*0.055);
  var paths=['weave','zigzag','dive','straight','weave'];
  var path=paths[(Math.random()*paths.length)|0];
  var golden = !force && Math.random()<0.07;
  var cols = golden ? ['#ffe071','#e0a72a','#8a6410'] : duckColors[(Math.random()*duckColors.length)|0];
  var x = force ? (fromLeft?34:VW-34) : (fromLeft?22:VW-22);
  return {
    x:x, y:y, baseY:y, vx:(fromLeft?1:-1)*baseSpd, path:path,
    t:Math.random()*4, phase:Math.random()*6.28, wing:Math.random()*6.28,
    cols:cols, golden:golden, panic:0, dead:false, esc:false, gone:false
  };
}
function duckRadius(){ return 23; }

/* ---------------- firing ---------------- */
function fire(lx,ly){
  if(state!=='playing') return;
  if(fireCd>0) return;
  var g=GUNS[gunIndex];
  if(shellsLeft<=0){ shellsLeft=g.shells; sndReload(); updateHud(); return; }
  if(introT>0) introT=0; // allow shooting to skip the intro card
  shellsLeft--;
  fireCd=g.fireRate;
  muzzle=1; recoil=1; shake=Math.min(9, 2.2+g.pellets*0.5); cross.pulse=1;
  sndShot();
  var shots=[{x:lx,y:ly}];
  for(var i=0;i<g.pellets;i++){
    shots.push({ x:lx+(Math.random()+Math.random()-1)*g.spread, y:ly+(Math.random()+Math.random()-1)*g.spread*0.72 });
  }
  var hitAny=false, dr=duckRadius();
  for(var s=0;s<shots.length;s++){
    var p=shots[s];
    for(var d=0; d<ducks.length; d++){
      var dk=ducks[d];
      if(dk.dead) continue;
      var dx=p.x-dk.x, dy=p.y-dk.y;
      if(dx*dx+dy*dy < dr*dr){ dk.dead=true; hitAny=true; onDuckHit(dk,p); }
    }
    for(var q=0;q<powerups.length;q++){
      var pu=powerups[q];
      if(pu.dead) continue;
      var px=p.x-pu.x, py=p.y-pu.y;
      if(px*px+py*py < 26*26){ pu.dead=true; hitAny=true; onPowerup(pu); }
    }
  }
  if(!hitAny){ combo=0; comboTimer=0; for(var k=0;k<ducks.length;k++){ ducks[k].panic=Math.min(1.6,(ducks[k].panic||0)+0.7); } }
  // reap dead ducks -> falling + dog
  var keep=[];
  for(var m=0;m<ducks.length;m++){
    var dd=ducks[m];
    if(dd.dead){
      falling.push({ x:dd.x, y:dd.y, vx:dd.vx*0.5, vy:-0.04, rot:0, t:0, cols:dd.cols, golden:dd.golden, landed:false });
    } else keep.push(dd);
  }
  ducks=keep;
  updateHud();
}
function onDuckHit(dk,p){
  combo++; comboTimer=2600;
  var mult=1+Math.floor(combo/3); if(mult>5) mult=5;
  var pts=Math.round(GUNS[gunIndex].points * DIFFS[diffIndex].mul * mult * (dblT>0?2:1) * (dk.golden?6:1));
  score+=pts;
  if(score>best){ best=score; save.best=best; if(best>=25000) save.guns[3]=true; writeSave(); }
  popText(dk.x, dk.y, '+'+pts, dk.golden?'#ffe071':(dblT>0?'#8ad4ff':'#ffe58a'));
  feathers(dk.x, dk.y, dk.cols, dk.golden?22:14);
  if(SCENES[sceneIndex].water) splash(dk.x, dk.y);
  if(combo>=3) popText(dk.x, dk.y-22, 'COMBO x'+mult, '#6dffa1');
  sndQuack();
  ducksDown++;
}
function onPowerup(pu){
  sndPower();
  if(pu.type==='slow'){ slowT=4200; popText(pu.x,pu.y,'SLOW-MO','#8ad4ff'); }
  else if(pu.type==='shells'){ shellsLeft+=3; popText(pu.x,pu.y,'+3 SHELLS','#6dffa1'); }
  else if(pu.type==='dbl'){ dblT=10000; popText(pu.x,pu.y,'DOUBLE PTS','#ffd34d'); }
  else { score+=750; popText(pu.x,pu.y,'+750','#ffe071'); }
  sparkles(pu.x,pu.y,'#ffe071');
  updateHud();
}
function spawnPowerup(){
  var types=['slow','slow','shells','dbl','gold'];
  var type=types[(Math.random()*types.length)|0];
  powerups.push({ x: Math.random()<0.5?30:VW-30, y:110+Math.random()*80,
    vx:(Math.random()<0.5?1:-1)*0.055, type:type, dead:false, t:Math.random()*6.28 });
}

/* ---------------- round flow ---------------- */
function threshold(){ return Math.min(roundTarget, DIFFS[diffIndex].thr); }
function newGame(){
  score=0; round=1; combo=0; fireCd=0;
  ducks=[]; falling=[]; particles=[]; popups=[]; powerups=[];
  ducksDown=0; roundAttempts=0; slowT=0; dblT=0; shake=0; muzzle=0; recoil=0;
  dogState='idle'; dogT=0; dogDuck=null;
  gunIndex=0;
  hideOverlay();
  setScene(sceneForRound(round), true);
  state='playing';
  startRound();
  updateHud();
}
function startRound(){
  ducksDown=0; roundAttempts=0;
  shellsLeft=GUNS[gunIndex].shells;
  spawnTimer=560; roundClearTimer=0;
  state='playing';
  cross.x=VW/2; cross.y=VH/2-30;
  updateHud();
}
function endRound(){
  if(ducksDown>=threshold()){
    state='roundClear'; roundClearTimer=1500; sndJingle();
    popText(VW/2, 150, 'ROUND CLEAR!', '#6dffa1');
  } else {
    state='gameover';
    if(score>best){ best=score; save.best=best; }
    writeSave(); sndLose();
    showOverlay('GAME OVER', 'MISSED THE QUOTA — '+ducksDown+' / '+roundTarget+' DUCKS. BEST '+best, 'RETRY');
  }
  updateHud();
}
function advanceRound(){
  if(state!=='roundClear') return;
  round++;
  if(round>ROUNDS_TO_WIN){
    state='win';
    if(score>best){ best=score; save.best=best; }
    writeSave();
    showOverlay('SEASON COMPLETE', 'ALL '+ROUNDS_TO_WIN+' ROUNDS CLEARED — FINAL SCORE '+score, 'PLAY AGAIN');
    updateHud();
    return;
  }
  setScene(sceneForRound(round), true);
  startRound();
}

/* ---------------- input ---------------- */
function onPointerDown(ev){
  var cx=ev.clientX, cy=ev.clientY;
  var p=toLocal(cx,cy);
  cross.x=clamp(p.x,0,VW); cross.y=clamp(p.y,0,VH);
  cross.pulse=1;
  if(state==='title' || state==='gameover' || state==='win'){ return; }
  fire(cross.x, cross.y);
}
function cycleGun(){
  var n=GUNS.length;
  for(var i=1;i<=n;i++){
    var idx=(gunIndex+i)%n;
    if(isUnlocked(idx)){ gunIndex=idx; break; }
  }
  shellsLeft=GUNS[gunIndex].shells;
  popText(VW/2, 120, GUNS[gunIndex].name.toUpperCase(), '#ffd34d');
  updateHud();
}
function isUnlocked(i){ return GUNS[i].unlock || save.guns[i]; }
function cycleDiff(){ diffIndex=(diffIndex+1)%DIFFS.length; updateHud(); }
function toggleMute(){ muted=!muted; if(!muted){ getAC(); } updateHud(); }

/* ---------------- update loop ---------------- */
function update(dt){
  tGlobal+=dt;
  if(fireCd>0) fireCd-=dt;
  if(shake>0) shake=Math.max(0, shake-dt*0.03);
  if(muzzle>0) muzzle=Math.max(0, muzzle-dt*0.0045);
  if(recoil>0) recoil=Math.max(0, recoil-dt*0.005);
  if(cross.pulse>0) cross.pulse=Math.max(0, cross.pulse-dt*0.004);
  if(slowT>0) slowT=Math.max(0, slowT-dt);
  if(dblT>0) dblT=Math.max(0, dblT-dt);
  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) combo=0; }
  if(dogT>0){ dogT-=dt; if(dogT<=0 && dogState==='laugh') dogState='idle'; }

  var slow = slowT>0 ? 0.42 : 1;
  updateWeather(dt);

  if(state==='playing'){
    if(introT>0){ introT-=dt; }
    else {
      spawnTimer-=dt;
      var maxConc=1+Math.floor((round-1)/3); if(maxConc>3) maxConc=3;
      if(spawnTimer<=0 && roundAttempts<roundTarget && ducks.length<maxConc){
        roundAttempts++;
        ducks.push(spawnDuck(false));
        if(Math.random()<0.16) spawnPowerup();
        spawnTimer=Math.max(360, 1350-round*52);
      }
    }
    var i;
    for(i=0;i<ducks.length;i++){
      var dk=ducks[i];
      dk.t+=dt*slow*0.001;
      if(dk.panic>0) dk.panic=Math.max(0, dk.panic-dt*0.0007);
      switch(dk.path){
        case 'weave':  dk.y=dk.baseY+Math.sin(dk.t*3.2+dk.phase)*17; break;
        case 'zigzag': dk.y=dk.baseY+(((dk.t*2.4+dk.phase)%2<1)?1:-1)*22; break;
        case 'dive': { var cyc=(dk.t*0.5+dk.phase)%2; dk.y=dk.baseY+(cyc<1?cyc*34:(2-cyc)*34); break; }
        default:       dk.y=dk.baseY+Math.sin(dk.t*1.2)*7;
      }
      if(dk.y<72) dk.y=72; if(dk.y>HORIZON-20) dk.y=HORIZON-20;
      dk.x+=dk.vx*dt*slow*(1+dk.panic*0.9);
      dk.wing+=dt*slow*0.017;
      if(dk.x<-44 || dk.x>VW+44) dk.esc=true;
    }
    var esc=false;
    for(i=0;i<ducks.length;i++){ if(ducks[i].esc){ ducks[i].gone=true; esc=true; } }
    if(esc){ dogState='laugh'; dogT=1250; combo=0; comboTimer=0; }
    ducks=ducks.filter(function(d){ return !d.gone; });

    if(roundAttempts>=roundTarget && ducks.length===0 && state==='playing'){ endRound(); }
  }

  if(state==='roundClear'){ roundClearTimer-=dt; if(roundClearTimer<=0) advanceRound(); }

  // powerups
  for(var q=0;q<powerups.length;q++){
    var pu=powerups[q];
    pu.x+=pu.vx*dt; pu.t+=dt*0.006;
    if(pu.x<-40||pu.x>VW+40) pu.dead=true;
  }
  powerups=powerups.filter(function(p){ return !p.dead; });

  // falling ducks
  for(var f=0;f<falling.length;f++){
    var fd=falling[f];
    fd.t+=dt;
    fd.vy+=dt*0.00055;
    fd.y+=fd.vy*dt;
    fd.x+=fd.vx*dt;
    fd.rot+=dt*0.005;
    if(fd.y>=HORIZON+46){ fd.y=HORIZON+46; if(!fd.landed){ fd.landed=true;
      dogState='retrieve'; dogT=1500; dogDuck=fd; } }
  }
  falling=falling.filter(function(f2){ return !(f2.landed && f2.t>950); });

  // particles
  for(var pi=0;pi<particles.length;pi++){
    var pt=particles[pi];
    pt.t+=dt;
    pt.vy+=pt.g*dt;
    pt.x+=pt.vx*dt; pt.y+=pt.vy*dt;
    pt.rot+=dt*0.008;
  }
  particles=particles.filter(function(p){ return p.t<p.life; });

  // popups
  for(var pp=0;pp<popups.length;pp++){ var po=popups[pp]; po.t+=dt; po.y-=dt*0.028; }
  popups=popups.filter(function(p){ return p.t<p.life; });
}

/* ==========================================================================
   RENDER
   ========================================================================== */
function render(){
  if(!ctx) return;
  var sx=cv.width/VW, sy=cv.height/VH;
  if(!isFinite(sx)||sx<=0) sx=1;
  if(!isFinite(sy)||sy<=0) sy=1;
  ctx.setTransform(sx,0,0,sy,0,0);
  ctx.clearRect(0,0,VW,VH);

  ctx.save();
  if(shake>0.2){ ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); }
  drawSky();
  drawScenery();
  drawWeather();
  drawPowerups();
  drawFallingDucks();
  drawDucks();
  drawDog();
  drawParticles();
  drawPopups();
  drawGun();
  ctx.restore();

  drawCrosshair();
  drawIntroCard();
  drawStatusBanner();
}

function drawSky(){
  var s=SCENES[sceneIndex], n=s.bands.length, bh=(HORIZON)/n;
  for(var i=0;i<n;i++){
    ctx.fillStyle=s.bands[i];
    ctx.fillRect(0, i*bh-0.5, VW, bh+1.2);
  }
  // horizon glow
  ctx.globalAlpha=0.18; ctx.fillStyle=s.tint;
  ctx.fillRect(0, HORIZON-42, VW, 42);
  ctx.globalAlpha=1;
}

function tri(x1,y1,x2,y2,x3,y3){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath(); }
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function pine(x, baseY, h, w, dark){
  var tiers=3;
  for(var i=0;i<tiers;i++){
    var tw=w*(1-i*0.22), ty=baseY-h*(i/tiers)-h*0.16, th=h/tiers+6;
    ctx.fillStyle = i%2? dark : '#0e3a1c';
    tri(x-tw, ty, x, ty-th, x+tw, ty);
  }
  ctx.fillStyle='#3a2410'; ctx.fillRect(x-2, baseY-4, 4, 12);
}
function drawScenery(){
  var s=SCENES[sceneIndex];
  if(sceneIndex===0){ meadow(); }
  else if(sceneIndex===1){ marsh(); }
  else if(sceneIndex===2){ lake(); }
  else if(sceneIndex===3){ canyon(); }
  else { snowScene(); }
}

function groundBase(c1,c2){
  ctx.fillStyle=c1; ctx.fillRect(0, HORIZON, VW, VH-HORIZON);
  ctx.fillStyle=c2; ctx.fillRect(0, HORIZON+40, VW, VH-HORIZON-40);
}
function grassTufts(color, y0, y1, count, sway){
  ctx.strokeStyle=color; ctx.lineWidth=1.4; ctx.lineCap='round';
  for(var i=0;i<count;i++){
    var x=(i*97.13)%VW;
    var yy=y0+((i*53.7)%(y1-y0));
    var sw=Math.sin(tGlobal*0.002+ x*0.05)*sway;
    ctx.beginPath(); ctx.moveTo(x,yy); ctx.quadraticCurveTo(x+sw,yy-7,x+sw*1.6,yy-13); ctx.stroke();
  }
}

function meadow(){
  var s=SCENES[0];
  // rolling hills
  ctx.fillStyle='#3c8a3c';
  ctx.beginPath(); ctx.moveTo(0,HORIZON); ctx.quadraticCurveTo(180,HORIZON-52,360,HORIZON-14); ctx.quadraticCurveTo(520,HORIZON+8,VW,HORIZON-24); ctx.lineTo(VW,HORIZON+60); ctx.lineTo(0,HORIZON+60); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2f7231';
  ctx.beginPath(); ctx.moveTo(0,HORIZON+6); ctx.quadraticCurveTo(240,HORIZON-30,470,HORIZON+10); ctx.quadraticCurveTo(560,HORIZON+20,VW,HORIZON+4); ctx.lineTo(VW,HORIZON+70); ctx.lineTo(0,HORIZON+70); ctx.closePath(); ctx.fill();
  // pines
  pine(70,HORIZON+2,58,20,false); pine(104,HORIZON+6,44,16,true); pine(568,HORIZON+2,64,22,false); pine(536,HORIZON+8,42,15,true);
  groundBase(s.ground, s.ground2);
  grassTufts('#1f6b2a', HORIZON+18, VH-6, 90, 3);
  grassTufts('#5fbf52', HORIZON+30, VH-4, 70, 2.2);
}
function marsh(){
  var s=SCENES[1];
  // water
  ctx.fillStyle='#3a3350'; ctx.fillRect(0,HORIZON,VW,VH-HORIZON);
  ctx.fillStyle='#5a4a6e'; ctx.fillRect(0,HORIZON,VW,3);
  // ripples
  ctx.strokeStyle='rgba(255,170,90,0.35)'; ctx.lineWidth=1.4;
  for(var i=0;i<10;i++){
    var y=HORIZON+10+i*13, off=Math.sin(tGlobal*0.0016+i)*16;
    ctx.beginPath(); ctx.moveTo(off+ (i*40)%60, y); ctx.lineTo(off+120+(i*40)%60, y); ctx.stroke();
  }
  // fog bands
  ctx.globalAlpha=0.16; ctx.fillStyle='#ffd9b0';
  for(var f=0;f<4;f++){ var fy=HORIZON-10+f*10+Math.sin(tGlobal*0.0008+f)*4; ctx.fillRect(0,fy,VW,6); }
  ctx.globalAlpha=1;
  // reeds
  ctx.strokeStyle='#1a2a1c'; ctx.lineWidth=2.2; ctx.lineCap='round';
  for(var r=0;r<22;r++){
    var x=(r*61.7)%VW, hh=18+((r*29)%26), sw=Math.sin(tGlobal*0.0018+r)*5;
    ctx.beginPath(); ctx.moveTo(x,HORIZON+8); ctx.quadraticCurveTo(x+sw,HORIZON-hh*0.5,x+sw*1.4,HORIZON-hh); ctx.stroke();
  }
  groundBase(s.ground,s.ground2);
  grassTufts('#20301f', HORIZON+50, VH-4, 60, 2.4);
}
function lake(){
  var s=SCENES[2];
  // snow peaks
  function peak(cx, base, h, w){
    tri(cx-w, base, cx, base-h, cx+w, base); ctx.fillStyle='#6b7390'; ctx.fill();
    tri(cx-w*0.42, base-h*0.58, cx, base-h, cx+w*0.42, base-h*0.58); ctx.fillStyle='#f2f6ff'; ctx.fill();
  }
  peak(120,HORIZON+4,96,86); peak(250,HORIZON+2,120,110); peak(430,HORIZON+6,84,78); peak(560,HORIZON+2,102,92);
  // mirrored lake
  ctx.fillStyle='#40506b'; ctx.fillRect(0,HORIZON,VW,VH-HORIZON);
  ctx.globalAlpha=0.22; ctx.fillStyle='#e9c7d8';
  for(var i=0;i<26;i++){ ctx.fillRect(0, HORIZON+ i*5, VW, 2); }
  ctx.globalAlpha=1;
  // reflection shimmer
  ctx.strokeStyle='rgba(255,220,235,0.28)'; ctx.lineWidth=1.2;
  for(var r=0;r<8;r++){ var y=HORIZON+8+r*12, o=Math.sin(tGlobal*0.0014+r)*10; ctx.beginPath(); ctx.moveTo(o+40,y); ctx.lineTo(o+180,y); ctx.stroke(); }
  // pine silhouettes
  pine(50,HORIZON+2,54,18,true); pine(600,HORIZON+2,60,20,true);
  groundBase('#4a5a72','#33405a');
}
function canyon(){
  var s=SCENES[3];
  // mesa layers
  function mesa(y,h,w,x,col){
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+10,y-h); ctx.lineTo(x+w-12,y-h); ctx.lineTo(x+w,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); ctx.fill();
  }
  mesa(HORIZON-24,30,180,-20,'#5c2a17');
  mesa(HORIZON-14,44,150,150,'#76341c');
  mesa(HORIZON-30,54,190,400,'#4a2012');
  mesa(HORIZON-6,38,160,300,'#8a3f20');
  groundBase(s.ground,s.ground2);
  // dust haze
  ctx.globalAlpha=0.2; ctx.fillStyle='#ffb066'; ctx.fillRect(0,HORIZON-6,VW,10); ctx.globalAlpha=1;
  // tumbleweed
  var tx=(tGlobal*0.09)%(VW+120)-60, ty=HORIZON+70+Math.sin(tGlobal*0.004)*10;
  ctx.strokeStyle='#3a1e0e'; ctx.lineWidth=1.4;
  for(var a=0;a<9;a++){ var an=a*0.7+tGlobal*0.002; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx+Math.cos(an)*13, ty+Math.sin(an)*13); ctx.stroke(); }
  grassTufts('#4a2a14', HORIZON+40, VH-6, 50, 3);
}
function snowScene(){
  var s=SCENES[4];
  // aurora
  ctx.globalAlpha=0.22;
  for(var b=0;b<5;b++){
    var col= b%2? '#7dffc0':'#a98cff';
    ctx.fillStyle=col;
    var yy=18+b*11, amp=8+b;
    ctx.beginPath(); ctx.moveTo(0,yy);
    for(var x=0;x<=VW;x+=40){ ctx.lineTo(x, yy+Math.sin(tGlobal*0.0012+x*0.01+b)*amp); }
    ctx.lineTo(VW,yy+18); ctx.lineTo(0,yy+18); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=1;
  // frosted pines
  function frostPine(x,base,h,w){
    for(var i=0;i<3;i++){ var tw=w*(1-i*0.22), ty=base-h*(i/3)-h*0.16, th=h/3+6;
      tri(x-tw,ty,x,ty-th,x+tw,ty); ctx.fillStyle= i%2?'#1b3a2c':'#25523b'; ctx.fill();
      tri(x-tw*0.7,ty-2,x,ty-th*0.9,x+tw*0.7,ty-2); ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.fill();
    }
    ctx.fillStyle='#c9a27a'; ctx.fillRect(x-2,base-4,5,12);
  }
  frostPine(66,HORIZON+6,66,24); frostPine(120,HORIZON+10,48,18); frostPine(566,HORIZON+4,72,26); frostPine(514,HORIZON+10,46,17);
  groundBase(s.ground,s.ground2);
  // drifts
  ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.beginPath(); ctx.moveTo(0,VH); ctx.quadraticCurveTo(160,VH-34,340,VH-8); ctx.quadraticCurveTo(500,VH+6,VW,VH-22); ctx.lineTo(VW,VH); ctx.closePath(); ctx.fill();
}

function drawWeather(){
  var kind=SCENES[sceneIndex].weather;
  for(var i=0;i<weather.length;i++){
    var p=weather[i];
    if(kind==='clouds'){
      ctx.globalAlpha=p.a; ctx.fillStyle='#ffffff';
      rr(p.x, p.y, p.s*1.7, p.s*0.6, p.s*0.3); ctx.fill();
      rr(p.x+p.s*0.5, p.y-p.s*0.3, p.s*0.9, p.s*0.55, p.s*0.28); ctx.fill();
      ctx.globalAlpha=1;
    } else if(kind==='fireflies'){
      var g=0.5+0.5*Math.sin(p.p*3);
      ctx.globalAlpha=p.a*g; ctx.fillStyle='#ffe98a';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,6.283); ctx.fill();
      ctx.globalAlpha=1;
    } else if(kind==='birds'){
      ctx.strokeStyle='rgba(30,30,40,'+p.a+')'; ctx.lineWidth=1.4;
      var f=Math.sin(tGlobal*0.01+i)*2;
      ctx.beginPath(); ctx.moveTo(p.x-p.s,p.y+f); ctx.lineTo(p.x,p.y); ctx.lineTo(p.x+p.s,p.y+f); ctx.stroke();
    } else if(kind==='dust'){
      ctx.globalAlpha=p.a; ctx.fillStyle='#ffd9a8';
      ctx.fillRect(p.x,p.y,p.s,p.s); ctx.globalAlpha=1;
    } else { // snow
      ctx.globalAlpha=p.a; ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,6.283); ctx.fill(); ctx.globalAlpha=1;
    }
  }
}

function drawPowerups(){
  for(var i=0;i<powerups.length;i++){
    var pu=powerups[i], bob=Math.sin(pu.t*2)*3;
    var col = pu.type==='slow'?'#8ad4ff': pu.type==='shells'?'#6dffa1': pu.type==='dbl'?'#ffd34d':'#ffe071';
    ctx.save(); ctx.translate(pu.x, pu.y+bob); ctx.rotate(pu.t*0.5);
    // glow halo
    ctx.globalAlpha=0.35; ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(0,0,18,0,6.283); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle='#0b0f16'; ctx.beginPath(); ctx.arc(0,0,13,0,6.283); ctx.fill();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(0,0,10,0,6.283); ctx.fill();
    ctx.fillStyle='#0b0f16'; ctx.font='bold 12px ui-monospace, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    var lab = pu.type==='slow'?'S': pu.type==='shells'?'3': pu.type==='dbl'?'2':'G';
    ctx.fillText(lab,0,0.5);
    ctx.restore();
  }
}

function drawDuckShape(dk, alpha, scale){
  var cols=dk.cols;
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.translate(dk.x, dk.y);
  ctx.scale(scale||1, scale||1);
  if(dk.golden){ ctx.shadowBlur=16; ctx.shadowColor='#ffe071'; }
  ctx.lineWidth=2; ctx.lineJoin='round';
  // body
  ctx.fillStyle=cols[0]; ctx.strokeStyle='#0b0f16';
  ctx.beginPath(); ctx.ellipse(0,4,18,11,0,0,6.283); ctx.fill(); ctx.stroke();
  // wing (flap)
  var flap=Math.sin(dk.wing)*0.7;
  ctx.fillStyle=cols[1];
  ctx.beginPath(); ctx.ellipse(-2,-1-flap*4,9,6,flap*0.6,0,6.283); ctx.fill(); ctx.stroke();
  // head
  ctx.fillStyle=cols[0];
  ctx.beginPath(); ctx.arc(13,-6,7,0,6.283); ctx.fill(); ctx.stroke();
  // eye
  ctx.fillStyle='#0b0f16'; ctx.beginPath(); ctx.arc(15,-8,1.8,0,6.283); ctx.fill();
  // beak
  ctx.fillStyle=cols[2]||'#e0a020';
  tri(19,-6, 28,-4, 19,-2); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.restore();
}
function drawDucks(){
  for(var i=0;i<ducks.length;i++){ drawDuckShape(ducks[i],1,1); }
}
function drawFallingDucks(){
  for(var i=0;i<falling.length;i++){
    var fd=falling[i];
    ctx.save(); ctx.translate(fd.x,fd.y); ctx.rotate(fd.rot);
    var tmp={ x:0, y:0, cols:fd.cols, wing:2, golden:fd.golden };
    ctx.translate(-0,0);
    // draw simple falling duck (no wing flap)
    ctx.globalAlpha=1;
    if(fd.golden){ ctx.shadowBlur=14; ctx.shadowColor='#ffe071'; }
    ctx.lineWidth=2; ctx.strokeStyle='#0b0f16';
    ctx.fillStyle=fd.cols[0];
    ctx.beginPath(); ctx.ellipse(0,0,18,11,0,0,6.283); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(13,-6,7,0,6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle=fd.cols[1]; ctx.beginPath(); ctx.ellipse(-3,0,8,5,0.4,0,6.283); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();
  }
}

function drawDog(){
  var gx=VW/2, base=VH-6;
  var up = (dogState==='retrieve'||dogState==='laugh') ? 1 : (dogState==='idle'?0.12:0);
  ctx.save();
  ctx.translate(gx, base);
  // grass mound foreground
  var bounce = dogState==='laugh' ? Math.abs(Math.sin(tGlobal*0.02))*6 : 0;
  ctx.translate(0, -bounce - up*70);
  ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.strokeStyle='#0b0f16';
  // body
  ctx.fillStyle='#b5713a'; ctx.beginPath(); ctx.ellipse(0,10,34,20,0,0,6.283); ctx.fill(); ctx.stroke();
  // head
  ctx.fillStyle='#c8854a'; ctx.beginPath(); ctx.ellipse(26,-6,16,13,0,0,6.283); ctx.fill(); ctx.stroke();
  // snout
  ctx.beginPath(); ctx.moveTo(34,-4); ctx.lineTo(50,2); ctx.lineTo(34,10); ctx.closePath(); ctx.fill(); ctx.stroke();
  // nose
  ctx.fillStyle='#2a1a0e'; ctx.beginPath(); ctx.arc(49,2,3.2,0,6.283); ctx.fill();
  // ear
  ctx.fillStyle='#8a4f22'; ctx.beginPath(); ctx.moveTo(16,-14); ctx.quadraticCurveTo(6,-30,24,-22); ctx.closePath(); ctx.fill(); ctx.stroke();
  // eye
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(30,-9,4,0,6.283); ctx.fill();
  ctx.fillStyle='#0b0f16'; ctx.beginPath(); ctx.arc(31,-9,2,0,6.283); ctx.fill();
  // mouth
  if(dogState==='laugh'){
    ctx.fillStyle='#5a1220';
    ctx.beginPath(); ctx.ellipse(40,7,7,5,0,0,6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#ff5a5a'; ctx.font='bold 12px ui-monospace, monospace'; ctx.textAlign='center';
  } else {
    ctx.strokeStyle='#0b0f16'; ctx.beginPath(); ctx.arc(38,6,5,0,3.14); ctx.stroke();
  }
  // retrieved duck in mouth
  if(dogState==='retrieve'){
    var dc=(dogDuck&&dogDuck.cols)?dogDuck.cols:['#7a4a1e','#5c3412','#3a2210'];
    ctx.fillStyle=dc[0]; ctx.strokeStyle='#0b0f16';
    ctx.beginPath(); ctx.ellipse(60,4,16,9,-0.3,0,6.283); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(72,0,6,0,6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#e0a020'; tri(77,0,84,2,77,4); ctx.fill();
  }
  ctx.restore();

  // foreground grass tufts over the dog's feet
  grassTufts('#1f6b2a', VH-26, VH-4, 40, 2.5);
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    var a=clamp(1 - p.t/p.life, 0, 1);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.c;
    if(p.kind==='feather'){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.beginPath(); ctx.ellipse(0,0,p.s*1.6,p.s*0.7,0,0,6.283); ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,6.283); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}
function drawPopups(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(var i=0;i<popups.length;i++){
    var p=popups[i];
    var a=clamp(1 - p.t/p.life,0,1);
    ctx.globalAlpha=a;
    ctx.font='bold 17px ui-monospace, monospace';
    ctx.lineWidth=3; ctx.strokeStyle='#0b0f16';
    ctx.strokeText(p.txt,p.x,p.y);
    ctx.fillStyle=p.col; ctx.fillText(p.txt,p.x,p.y);
  }
  ctx.globalAlpha=1;
}

function drawGun(){
  var g=GUNS[gunIndex];
  var rec = recoil*10;
  ctx.save();
  ctx.translate(VW*0.5, VH-4+rec);
  // barrel
  ctx.lineWidth=3; ctx.strokeStyle='#0b0f16'; ctx.lineJoin='round';
  ctx.fillStyle=g.metal;
  rr(-11,-96,22,74,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle=g.body;
  rr(-15,-96,30,30,8); ctx.fill(); ctx.stroke();
  // stock/handguard
  ctx.fillStyle='#5c3a1c';
  ctx.beginPath(); ctx.moveTo(-20,-14); ctx.lineTo(20,-14); ctx.lineTo(30,14); ctx.lineTo(-30,14); ctx.closePath(); ctx.fill(); ctx.stroke();
  // muzzle
  ctx.fillStyle=g.body; rr(-13,-104,26,12,4); ctx.fill(); ctx.stroke();
  // muzzle flash
  if(muzzle>0){
    ctx.globalAlpha=muzzle;
    ctx.fillStyle=g.muzzle;
    ctx.beginPath(); ctx.arc(0,-108, 14+ (1-muzzle)*10, 0, 6.283); ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(0,-108,7,0,6.283); ctx.fill();
    tri(0,-124, -7,-108, 7,-108); ctx.fill();
    tri(0,-124, -7,-108, 7,-108);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawCrosshair(){
  if(state==='title') return;
  var pulse = 1 + cross.pulse*0.35;
  var col = dblT>0 ? '#ffd34d' : '#ffffff';
  ctx.save();
  ctx.translate(cross.x, cross.y);
  ctx.globalAlpha=0.95;
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineCap='round';
  var r=13*pulse;
  ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,3,0,6.283); ctx.stroke();
  var l=9;
  ctx.beginPath();
  ctx.moveTo(-r-l,0); ctx.lineTo(-r+3,0);
  ctx.moveTo(r-3,0); ctx.lineTo(r+l,0);
  ctx.moveTo(0,-r-l); ctx.lineTo(0,-r+3);
  ctx.moveTo(0,r-3); ctx.lineTo(0,r+l);
  ctx.stroke();
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawIntroCard(){
  if(introT<=0 || state==='gameover' || state==='win') return;
  var a=clamp(introT/500,0,1) * clamp((1500-introT)/300,0,1);
  ctx.save();
  ctx.globalAlpha=0.5*a;
  ctx.fillStyle='#05070b'; ctx.fillRect(0,140,VW,84);
  ctx.globalAlpha=a;
  ctx.fillStyle='#ffd34d'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 26px ui-monospace, monospace';
  ctx.fillText('AREA '+((sceneIndex%SCENES.length)+1)+' — '+SCENES[sceneIndex].name.toUpperCase(), VW/2, 172);
  ctx.fillStyle='#e9f2ff'; ctx.font='bold 13px ui-monospace, monospace';
  ctx.fillText('DIFFICULTY: '+DIFFS[diffIndex].name.toUpperCase()+'   ·   CLEAR '+threshold()+' OF '+roundTarget, VW/2, 200);
  ctx.restore();
}
function drawStatusBanner(){
  if(state==='roundClear'){
    ctx.save(); ctx.globalAlpha=0.85;
    ctx.fillStyle='#6dffa1'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 30px ui-monospace, monospace';
    ctx.fillText('ROUND '+round+' CLEAR!', VW/2, 150);
    ctx.restore();
  }
  if(combo>=3 && state==='playing'){
    ctx.save(); ctx.globalAlpha=0.9;
    ctx.fillStyle='#6dffa1'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.font='bold 15px ui-monospace, monospace';
    ctx.fillText('COMBO x'+(1+Math.floor(combo/3)), 12, 40);
    ctx.restore();
  }
  if(slowT>0){ ctx.save(); ctx.globalAlpha=0.9; ctx.fillStyle='#8ad4ff'; ctx.textAlign='right'; ctx.textBaseline='top'; ctx.font='bold 14px ui-monospace, monospace'; ctx.fillText('SLOW-MO', VW-12, 40); ctx.restore(); }
  if(dblT>0){ ctx.save(); ctx.globalAlpha=0.9; ctx.fillStyle='#ffd34d'; ctx.textAlign='right'; ctx.textBaseline='top'; ctx.font='bold 14px ui-monospace, monospace'; ctx.fillText('DOUBLE PTS', VW-12, 58); ctx.restore(); }
}

/* ---------------- loop ---------------- */
var lastNow=0;
function loop(ts){
  var now=(typeof ts==='number' && isFinite(ts))?ts:(performance.now());
  if(!lastNow) lastNow=now;
  var dt=now-lastNow; lastNow=now;
  if(!isFinite(dt) || dt<0) dt=0;
  if(dt>60) dt=60;
  update(dt);
  render();
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
function boot(){
  loadSave();
  best=save.best||0;
  resize();
  if(window && window.addEventListener) window.addEventListener('resize', function(){ resize(); });
  if(cv && cv.addEventListener) cv.addEventListener('pointerdown', onPointerDown);

  if(elStart) elStart.onclick=function(){ newGame(); };
  if(elMsgBtn) elMsgBtn.onclick=function(){ newGame(); };
  if(elGunBtn) elGunBtn.onclick=function(){ cycleGun(); };
  if(elDiffBtn) elDiffBtn.onclick=function(){ cycleDiff(); };
  if(elMute) elMute.onclick=function(){ toggleMute(); };

  setScene(0,false);
  updateHud();
  showOverlay('DUCK HUNT','TAP THE CANVAS TO SHOOT · CLEAR '+threshold()+' OF '+roundTarget+' DUCKS PER ROUND','START HUNT');
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
}
boot();

/* ---------------- debug hook ---------------- */
window.__hunt={
  state:function(){
    return {
      score:score, round:round, ducksAlive:ducks.length, shells:shellsLeft,
      gun:GUNS[gunIndex].name, scene:SCENES[sceneIndex].name, difficulty:DIFFS[diffIndex].name,
      ducks:ducks.map(function(d){ return { x:d.x, y:d.y }; })
    };
  },
  spawn:function(){
    if(state==='roundClear'){ advanceRound(); }
    if(state!=='playing'){ state='playing'; hideOverlay(); introT=0; }
    shellsLeft=GUNS[gunIndex].shells;
    if(roundAttempts<roundTarget) roundAttempts++;
    ducks.push(spawnDuck(true));
    updateHud();
    return true;
  },
  reset:function(){ newGame(); return true; }
};

})();
</script>
