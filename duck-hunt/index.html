<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>DUCK HUNT — Deluxe</title>
<style>
  :root{
    --ink:#eaf3ff; --dim:#8fa3c0; --hi:#ffd34d; --danger:#ff5a5a; --ok:#6dffa1;
    --chrome1:#161c27; --chrome2:#0a0d13; --edge:#3a4560;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; background:#04060a; overflow:hidden;
    color:var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  #wrap{ position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;
    background:#04060a; overflow:hidden; }
  /* ---- stat bar (OUTSIDE the canvas, never covers the playfield) ---- */
  #statbar{ flex:0 0 auto; display:flex; flex-wrap:wrap; gap:4px 8px; padding:5px 8px;
    background:linear-gradient(180deg,#10151f,#0a0e15); border-bottom:2px solid var(--edge);
    font-size:clamp(9px,2.4vw,12px); font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; line-height:1.4; max-height:64px; overflow:hidden; }
  .chip{ background:linear-gradient(180deg,var(--chrome1),var(--chrome2));
    border:2px solid var(--edge); border-radius:6px; padding:1px 7px;
    box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.07); color:var(--dim); white-space:nowrap; }
  .chip b{ color:var(--ink); font-weight:800; }
  #scoreChip b{ color:var(--hi); text-shadow:0 0 8px rgba(255,211,77,.6); }
  #quotaChip b{ color:var(--ok); }
  #shellChip b{ color:#ffcf8a; }
  /* ---- stage ---- */
  #stage{ position:relative; flex:1 1 auto; min-height:0; }
  #cv{ display:block; width:100%; height:100%; background:#000; touch-action:none; cursor:crosshair; }
  /* ---- controls ---- */
  #controls{ flex:0 0 auto; display:flex; gap:6px; padding:7px 8px; flex-wrap:wrap;
    background:linear-gradient(180deg,#0b0f16,#05070b); border-top:3px solid var(--edge); }
  button{ flex:1 1 0; min-height:46px; min-width:64px; border-radius:9px; cursor:pointer;
    font-family:inherit; font-weight:800; letter-spacing:.03em; text-transform:uppercase;
    font-size:clamp(10px,2.5vw,12px); color:var(--ink);
    background:linear-gradient(180deg,#2a3448,#141a26);
    border:2px solid var(--edge); box-shadow:0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,.10); }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 #000; filter:brightness(1.2); }
  button.small{ flex:0 0 auto; min-width:56px; }
  #pauseBtn{ background:linear-gradient(180deg,#39507a,#1d2b47); }
  #reloadBtn{ background:linear-gradient(180deg,#7a4a1e,#3d240e); border-color:#a06a34; }
  #muteBtn{ background:linear-gradient(180deg,#2c4436,#15251c); }
  /* ---- overlay panel ---- */
  #panel{ position:absolute; inset:0; z-index:9; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:10px; padding:16px;
    background:rgba(4,7,12,.82); }
  #panelTitle{ font-size:clamp(22px,7vw,52px); font-weight:900; letter-spacing:.05em;
    text-transform:uppercase; color:var(--hi);
    text-shadow:0 3px 0 #7a4a00, 0 0 22px rgba(255,211,77,.6); }
  #panelSub{ font-size:clamp(11px,3vw,15px); color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  #panelStats{ display:flex; flex-direction:column; gap:3px; font-size:clamp(11px,3vw,14px);
    text-transform:uppercase; letter-spacing:.05em; min-width:min(320px,86%); }
  #panelStats .row{ display:flex; justify-content:space-between; gap:16px;
    background:rgba(20,26,38,.8); border:1px solid var(--edge); border-radius:6px; padding:3px 10px; }
  #panelStats .row b{ color:var(--hi); }
  #panelMedal{ font-size:clamp(18px,5vw,30px); font-weight:900; letter-spacing:.08em; }
  #panelBtns{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  #panelBtns button{ min-width:150px; }
  @media (max-height:520px){
    #panel{ gap:5px; padding:6px 10px; overflow-y:auto; justify-content:flex-start; }
    #panelTitle{ font-size:clamp(20px,6vh,30px); }
    #panelSub{ font-size:10px; }
    #panelStats{ display:grid; grid-template-columns:1fr 1fr; gap:3px 8px; min-width:min(640px,94%); font-size:11px; }
    #panelStats .row:last-child{ grid-column:1/3; }
    #panelBtns button{ min-height:36px; min-width:120px; }
    #statbar{ max-height:30px; }
    button{ min-height:38px; }
    #controls{ padding:4px 8px; }
  }
  .primary{ background:linear-gradient(180deg,#ff8a2b,#c65a05) !important; border-color:#ffcf8a !important;
    color:#200d00 !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="statbar">
    <span class="chip" id="scoreChip">SCORE <b id="score">0</b></span>
    <span class="chip">BEST <b id="best">0</b></span>
    <span class="chip">AREA <b id="scene">Sunny Meadow</b></span>
    <span class="chip">RND <b id="round">1/15</b></span>
    <span class="chip" id="quotaChip">DUCKS <b id="quota">0/6</b></span>
    <span class="chip" id="shellChip">SHELLS <b id="shells">6</b></span>
    <span class="chip">GUN <b id="gun">12-Gauge</b></span>
    <span class="chip">MODE <b id="diff">Normal</b></span>
    <span class="chip" id="errChip" style="display:none;color:#ff8fa3"></span>
  </div>
  <div id="stage">
    <canvas id="cv" width="640" height="400"></canvas>
    <div id="panel">
      <div id="panelTitle">DUCK HUNT</div>
      <div id="panelSub">TAP TO SHOOT</div>
      <div id="panelStats"></div>
      <div id="panelMedal"></div>
      <div id="panelBtns"></div>
    </div>
  </div>
  <div id="controls">
    <button id="startBtn" class="primary">START</button>
    <button id="gunBtn">GUN</button>
    <button id="diffBtn">MODE</button>
    <button id="reloadBtn">RELOAD</button>
    <button id="pauseBtn" class="small">II</button>
    <button id="muteBtn" class="small">SND ON</button>
  </div>
</div>
<script>
/* Visible diagnostics: whoever maintains this page cannot open a console, so a script
   error must be shown on screen instead of failing silently. */
(function () {
  function show(t) {
    try {
      var h = document.getElementById('errChip');
      if (h) { h.textContent = t; h.style.display = ''; }
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    try {
      var f = (e && e.filename) ? String(e.filename).split('/').pop() : '?';
      show('JS ERROR: ' + ((e && e.message) || 'unknown') + '  (' + f + ':' + ((e && e.lineno) || 0) + ')');
    } catch (err) {}
  });
})();
</script>
<script>
(function(){
'use strict';

/* =========================================================================
   DUCK HUNT — DELUXE. Single file, procedural art + WebAudio only.
   Logical view 640x400, uniformly scaled + letterboxed.
   ========================================================================= */

var VW=640, VH=400, HORIZON=240, ROUNDS_TO_WIN=15, ROUND_TARGET=10, MAG=6;
var RELOAD_MS=1200;

function E(id){ return document.getElementById(id); }
var cv=E('cv'), ctx=cv?cv.getContext('2d'):null;
var elScore=E('score'), elBest=E('best'), elRound=E('round'), elQuota=E('quota'),
    elShells=E('shells'), elGun=E('gun'), elScene=E('scene'), elDiff=E('diff'),
    panel=E('panel'), pTitle=E('panelTitle'), pSub=E('panelSub'),
    pStats=E('panelStats'), pMedal=E('panelMedal'), pBtns=E('panelBtns'),
    bStart=E('startBtn'), bGun=E('gunBtn'), bDiff=E('diffBtn'),
    bReload=E('reloadBtn'), bPause=E('pauseBtn'), bMute=E('muteBtn');

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function hex2rgb(h){ return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]; }
function mixHex(a,b,t){
  var A=hex2rgb(a),B=hex2rgb(b);
  return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';
}

/* ---------------- save (v2, migrates v1) ---------------- */
var SAVE_KEY='duckhunt_save_v3', V2_KEY='duckhunt_save_v2', OLD_KEY='duckhunt_save_v1';
var save={ best:0, goldUnlocked:false, stars:{}, endlessBest:0 };
function loadSave(){
  try{
    if(typeof localStorage==='undefined'||!localStorage) return;
    var raw=localStorage.getItem(SAVE_KEY);
    if(raw){
      var o=JSON.parse(raw);
      if(o&&typeof o==='object'){
        if(typeof o.best==='number'&&isFinite(o.best)) save.best=o.best;
        if(typeof o.endlessBest==='number'&&isFinite(o.endlessBest)) save.endlessBest=o.endlessBest;
        save.goldUnlocked=!!o.goldUnlocked;
        save.stars={};
        if(o.stars&&typeof o.stars==='object'){ for(var k in o.stars){ var v=Math.floor(Number(o.stars[k])); if(v>0&&v<=3) save.stars[k]=v; } }
      }
      return;
    }
    var raw2=localStorage.getItem(V2_KEY);
    if(raw2){
      var o2=JSON.parse(raw2);
      if(o2&&typeof o2==='object'){
        if(typeof o2.best==='number'&&isFinite(o2.best)) save.best=o2.best;
        save.goldUnlocked=!!o2.goldUnlocked;
      }
      return;
    }
    var raw1=localStorage.getItem(OLD_KEY);
    if(raw1){ var o1=JSON.parse(raw1); if(o1&&typeof o1.best==='number'&&isFinite(o1.best)) save.best=o1.best; }
  }catch(e){}
}
function writeSave(){ try{ if(typeof localStorage!=='undefined'&&localStorage) localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }

/* ---------------- audio (ON by default, unlocked on first tap) ---------------- */
var AC=null, master=null, muted=false, audioReady=false, haptics=true;
function initAudio(){
  try{
    var C=(typeof AudioContext!=='undefined')?AudioContext:(typeof webkitAudioContext!=='undefined'?webkitAudioContext:null);
    if(!C) return;
    if(!AC){ AC=new C(); master=AC.createGain(); master.gain.value=0.09; master.connect(AC.destination); }
    if(AC.state==='suspended'&&AC.resume) AC.resume();
    audioReady=true;
  }catch(e){ audioReady=false; }
}
function tone(f0,f1,dur,type,vol,delay){
  if(muted||!audioReady) return;
  try{
    var a=AC; if(!a) return;
    var o=a.createOscillator(), g=a.createGain(), t=a.currentTime+(delay||0);
    o.type=type||'square';
    o.frequency.setValueAtTime(Math.max(1,f0),t);
    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol||0.06,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function noise(dur,vol,fLo){
  if(muted||!audioReady) return;
  try{
    var a=AC, n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    var s=a.createBufferSource(); s.buffer=buf;
    var flt=a.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=fLo||900;
    var g=a.createGain(); g.gain.value=vol||0.08;
    s.connect(flt); flt.connect(g); g.connect(master); s.start();
  }catch(e){}
}
function sndShot(){
  var p=0.92+Math.random()*0.16;              // no two shots sound the same
  noise(0.14,0.09,1400*p);                    // transient
  tone(160*p,40*p,0.16,'sawtooth',0.08);      // body
  tone(70*p,30*p,0.24,'square',0.05);         // low weight
  tone(2400*p,1200*p,0.05,'square',0.025);    // sweetener
}
function buzz(ms){
  if(!haptics) return;
  try{ if(typeof navigator!=='undefined'&&navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}
function sndClick(){ tone(1400,900,0.03,'square',0.03); }
function sndQuack(){ tone(440,190,0.09,'sawtooth',0.05); tone(380,160,0.08,'sawtooth',0.04,0.07); }
function sndReloadStart(){ tone(240,180,0.05,'square',0.04); }
function sndReloadDone(){ tone(180,420,0.07,'square',0.05); tone(420,520,0.05,'square',0.04,0.06); }
function sndPower(){ tone(660,1320,0.14,'square',0.05); tone(990,1760,0.12,'square',0.04,0.08); }
function sndJingle(){ var n=[523,659,784,1046],i; for(i=0;i<n.length;i++) tone(n[i],n[i],0.15,'square',0.05,i*0.11); }
function sndLaugh(){ tone(500,300,0.09,'square',0.05); tone(500,300,0.09,'square',0.05,0.12); tone(430,260,0.12,'square',0.05,0.24); }
function sndSparkle(){ var n=[1200,1600,2100],i; for(i=0;i<n.length;i++) tone(n[i],n[i]*1.2,0.09,'triangle',0.04,i*0.05); }
function sndSting(){ tone(300,60,0.6,'sawtooth',0.07); tone(150,40,0.7,'square',0.05,0.1); }
function sndTrophy(){ var n=[523,659,784,1046,1318],i; for(i=0;i<n.length;i++) tone(n[i],n[i],0.22,'triangle',0.06,i*0.14); }

/* ---------------- config ---------------- */
var GUNS=[
  { name:'12-Gauge', mag:6, spread:30, pellets:6, pts:100, rate:340, req:0,  body:'#8a5a2b', metal:'#c9d2dd', flash:'#ffd27a' },
  { name:'Rifle',    mag:4, spread:6,  pellets:1, pts:320, rate:800, req:3,  body:'#6b3f1d', metal:'#e6eef7', flash:'#fff1c0' },
  { name:'Auto-12',  mag:8, spread:44, pellets:9, pts:60,  rate:150, req:8,  body:'#2f3138', metal:'#9aa4b2', flash:'#ffbe63' },
  { name:'Golden Gun',mag:6, spread:14, pellets:7, pts:220, rate:300, req:20, body:'#d4af37', metal:'#fff2b0', flash:'#ffe071', gold:true }
];
var DIFFS=[
  { name:'Easy',   spd:0.82, thr:6, mul:1.0 },
  { name:'Normal', spd:1.0,  thr:7, mul:1.25 },
  { name:'Hard',   spd:1.35, thr:8, mul:1.7 }
];
var SPECIES=[
  { name:'Mallard', pts:100, size:1.0,  spd:1.0,  path:'weave',   r:23, cols:['#6a7f4a','#3d5230','#e0a020'], head:'#3f5a2e', wingbar:'#3b4f8a' },
  { name:'Pintail', pts:150, size:0.92, spd:1.15, path:'zigzag',  r:21, cols:['#9a8a72','#5c5142','#e8b23a'], head:'#5c4a34', wingbar:'#c8b28a' },
  { name:'Teal',    pts:200, size:0.78, spd:1.5,  path:'erratic', r:19, cols:['#5a7684','#31454f','#e07a30'], head:'#2e5a52', wingbar:'#6ab4d4' },
  { name:'Golden',  pts:500, size:1.0,  spd:1.2,  path:'weave',   r:23, cols:['#ffe071','#d4a017','#8a6410'], head:'#e8b62a', wingbar:'#fff2b0', gold:true }
];
var SCENES=[
  { name:'Sunny Meadow', top:'#1f66d6', bot:'#cfeaff', haze:'#eaf6ff', ground:'#3f9a3f', ground2:'#2b6f2b',
    sun:{x:520,y:56,r:26,col:'#fff3b0'}, stars:false, water:false, weather:'clouds', tint:'#7fd06a',
    far:'#7aa86a', mid:'#4f8a44' },
  { name:'Marsh at Dusk', top:'#241a44', bot:'#ff9a3c', haze:'#ffb15a', ground:'#2c3a2a', ground2:'#1b2a1c',
    sun:{x:110,y:196,r:34,col:'#ffd070'}, stars:true, water:true, weather:'fireflies', tint:'#ffb15a',
    far:'#3a2c50', mid:'#242038' },
  { name:'Alpine Lake', top:'#33286a', bot:'#ffd9e8', haze:'#e8c7e0', ground:'#4a5a72', ground2:'#33405a',
    sun:{x:320,y:60,r:20,col:'#fff0f6'}, stars:true, water:true, weather:'birds', tint:'#ffc7dd',
    far:'#5a5f88', mid:'#3e4468' },
  { name:'Canyon Sunset', top:'#4a1230', bot:'#ff7a24', haze:'#ff9a50', ground:'#8a3a1e', ground2:'#5c2412',
    sun:{x:480,y:150,r:30,col:'#ffc46a'}, stars:false, water:false, weather:'dust', tint:'#ff8a3c',
    far:'#6e2a18', mid:'#8a3a20' },
  { name:'Snowy Pines', top:'#101a30', bot:'#cfe0ff', haze:'#dce8ff', ground:'#eef4ff', ground2:'#c6d4ea',
    sun:{x:150,y:64,r:18,col:'#e8f2ff'}, stars:true, water:false, weather:'snow', tint:'#a9c7ff',
    far:'#3e4c6e', mid:'#2a3752' }
];

/* ---------------- state ---------------- */
var state='title'; // title|playing|paused|results|gameover|win
var prevState='playing';
var mode='hunt';   // 'hunt' (15-area campaign) | 'endless'
var areaStars=0;
var score=0, best=0, round=1, gunIndex=0, diffIndex=1, sceneIndex=0;
var ducks=[], falling=[], particles=[], popups=[], powerups=[], weather=[], casings=[];
var ducksDown=0, attempts=0, shellsLeft=MAG, reloading=false, reloadT=0;
var spawnTimer=600, introT=0, combo=0, comboTimer=0, bestCombo=0;
var shake=0, muzzle=0, recoil=0, fireCd=0, slowT=0, dblT=0, hitFlash=0;
var shots=0, hits=0, escapes=0;
var dog={ state:'idle', t:0, duck:null, misses:0 };
var cross={ x:VW/2, y:VH/2-40, pulse:0 };
var hitMark=null, missMark=null;
var tG=0, lastNow=0, hitStop=0, clutchShown=false;
var scaleS=1, offX=0, offY=0;
var bgLayer=null, fgLayer=null;

/* ---------------- layout / uniform scale ---------------- */
function resize(){
  var r=null;
  try{ if(cv.getBoundingClientRect) r=cv.getBoundingClientRect(); }catch(e){}
  var cw=(r&&isFinite(r.width)&&r.width>0)?r.width:VW;
  var ch=(r&&isFinite(r.height)&&r.height>0)?r.height:VH;
  var dpr=(typeof devicePixelRatio!=='undefined'&&devicePixelRatio)?devicePixelRatio:1;
  if(dpr>1.5) dpr=1.5;
  var w=Math.max(1,Math.round(cw*dpr)), h=Math.max(1,Math.round(ch*dpr));
  if(w!==cv.width) cv.width=w;
  if(h!==cv.height) cv.height=h;
  /* adaptive field: the logical view follows the screen shape so wide phones/Quest get a wide
     field and portrait phones get a tall one, instead of a small letterboxed 640x400 box */
  var asp=cw/ch, nVW=clamp(Math.round(400*asp),520,1200), nVH=clamp(Math.round(nVW/asp),400,700);
  if(!isFinite(nVW)||!isFinite(nVH)){ nVW=640; nVH=400; }
  var changed=(nVW!==VW||nVH!==VH);
  VW=nVW; VH=nVH;
  scaleS=Math.min(w/VW,h/VH);
  offX=(w-VW*scaleS)/2; offY=(h-VH*scaleS)/2;
  cvRect=r||null;
  if(changed){ glowCv=null; try{ if(typeof sceneIndex==='number'&&bgLayer){ buildSceneLayers(sceneIndex); initWeather(); } }catch(e){} }
}
/* pointer mapping (CSS px -> logical view, uniform scale + letterbox) */
var cvRect=null;
function measureRect(){
  try{ if(cv.getBoundingClientRect) cvRect=cv.getBoundingClientRect(); else cvRect=null; }catch(e){ cvRect=null; }
  return cvRect;
}
function toLocal2(cx,cy){
  var r=cvRect||measureRect();
  var l=(r&&isFinite(r.left))?r.left:0, t=(r&&isFinite(r.top))?r.top:0;
  var w=(r&&isFinite(r.width)&&r.width>0)?r.width:VW;
  var h=(r&&isFinite(r.height)&&r.height>0)?r.height:VH;
  var s=Math.min(w/VW,h/VH);
  var ox=(w-VW*s)/2, oy=(h-VH*s)/2;
  return { x:(cx-l-ox)/s, y:(cy-t-oy)/s };
}

/* ---------------- HUD ---------------- */
function updateHud(){
  if(elScore) elScore.textContent=String(score);
  if(elBest) elBest.textContent=String(best);
  if(elRound) elRound.textContent=(mode==='endless'?('WAVE '+round):(round+'/'+ROUNDS_TO_WIN));
  if(elQuota) elQuota.textContent=ducksDown+'/'+quota();
  if(elShells) elShells.textContent=reloading?'…':String(shellsLeft);
  if(elGun) elGun.textContent=GUNS[gunIndex].name;
  if(elScene) elScene.textContent=SCENES[sceneIndex].name;
  if(elDiff) elDiff.textContent=DIFFS[diffIndex].name;
  if(bGun) bGun.textContent=GUNS[gunIndex].name;
  if(bDiff) bDiff.textContent=DIFFS[diffIndex].name;
  if(bMute) bMute.textContent=muted?'SND OFF':'SND ON';
}
function showPanel(title,sub,stats,medal,btns){
  if(pTitle) pTitle.textContent=title;
  if(pSub) pSub.textContent=sub||'';
  if(pStats){ pStats.innerHTML=''; for(var i=0;i<stats.length;i++){ var d=document.createElement('div'); d.className='row';
    d.innerHTML='<span>'+stats[i][0]+'</span><b>'+stats[i][1]+'</b>'; pStats.appendChild(d); } }
  if(pMedal){ pMedal.textContent=medal||''; pMedal.style.color = medal&&medal.indexOf('GOLD')===0?'#ffd34d':(medal&&medal.indexOf('SILVER')===0?'#cfd8e6':(medal&&medal.indexOf('BRONZE')===0?'#d98d4a':'#eaf3ff')); }
  if(pBtns){ pBtns.innerHTML=''; for(var j=0;j<btns.length;j++){ (function(b){

/* ---------------- static scene pre-render ---------------- */
function tri(c,x1,y1,x2,y2,x3,y3){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.lineTo(x3,y3); c.closePath(); }
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function offCanvas(){
  try{ var oc=document.createElement('canvas'); oc.width=VW; oc.height=VH; return oc; }catch(e){ return null; }
}
var layerNoSun=false, layerOff=0;
function makeLayer(drawFn){
  /* scenery is authored for a 640-wide view: draw it there, then centre it and extend both sides
     with mirrored copies (sun-free, so there is only ever one sun) out to the current field width */
  var rW=VW, tA=null, tB=null; VW=640;
  try{
    tA=offCanvas(); layerNoSun=false; var cA=tA&&tA.getContext('2d'); if(cA) drawFn(cA);
    tB=offCanvas(); layerNoSun=true; var cB=tB&&tB.getContext('2d'); if(cB) drawFn(cB);
  }catch(e){ VW=rW; layerNoSun=false; return null; }
  VW=rW; layerNoSun=false;
  if(!tA||!tB) return tA;
  var oc=offCanvas(); if(!oc) return tA;
  var g=oc.getContext('2d'), o=Math.round((VW-640)/2), k, x, flip;
  layerOff=o;
  for(k=-3;k<=3;k++){ x=o+k*640; if(x>=VW||x+640<=0) continue;
    flip=(Math.abs(k)%2===1);
    if(k===0){ g.drawImage(tA,x,0); }
    else if(flip){ g.save(); g.translate(x+640,0); g.scale(-1,1); g.drawImage(tB,0,0); g.restore(); }
    else g.drawImage(tB,x,0); }
  return oc;
}
function pineOn(c,x,baseY,h,w,col1,col2,snow){
  var i;
  for(i=0;i<3;i++){
    var tw=w*(1-i*0.22), ty=baseY-h*(i/3)-h*0.16, th=h/3+7;
    tri(c,x-tw,ty,x,ty-th,x+tw,ty); c.fillStyle=i%2?col2:col1; c.fill();
    if(snow){ tri(c,x-tw*0.66,ty-2,x,ty-th*0.88,x+tw*0.66,ty-2); c.fillStyle='rgba(255,255,255,0.8)'; c.fill(); }
  }
  c.fillStyle='#3a2410'; c.fillRect(x-2,baseY-4,4,12);
}
function ridgeOn(c,base,amp,seed,col){
  c.fillStyle=col; c.beginPath(); c.moveTo(0,base);
  var x;
  for(x=0;x<=VW;x+=64){
    var y=base - amp*(0.55+0.45*Math.sin(seed+x*0.021)) - amp*0.4*Math.sin(seed*2.3+x*0.043);
    c.lineTo(x,y);
  }
  c.lineTo(VW,base+40); c.lineTo(0,base+40); c.closePath(); c.fill();
}
function starsOn(c,night){
  var i;
  for(i=0;i<70;i++){
    var x=(i*97.31+13)%VW, y=(i*53.7)% (HORIZON-40);
    var a=0.25+0.6*Math.abs(Math.sin(i*3.7));
    c.globalAlpha=a; c.fillStyle='#ffffff';
    c.fillRect(x,y,1.6,1.6);
  }
  c.globalAlpha=1;
}
function buildSceneLayers(idx){
  var s=SCENES[idx], i;
  bgLayer=makeLayer(function(c){
    var n=40, bh=HORIZON/n;
    for(i=0;i<n;i++){ c.fillStyle=mixHex(s.top,s.bot,i/(n-1)); c.fillRect(0,i*bh-0.5,VW,bh+1.4); }
    if(s.stars) starsOn(c,true);
    // god rays
    if(s.sun&&!layerNoSun){
      c.save(); c.globalAlpha=0.10; c.fillStyle=s.sun.col;
      for(i=0;i<6;i++){ c.save(); c.translate(s.sun.x,s.sun.y); c.rotate(-1.2+i*0.36+Math.sin(i)*0.1); c.fillRect(0,-3,420,6); c.restore(); }
      c.restore();
      var gr=c.createRadialGradient(s.sun.x,s.sun.y,4,s.sun.x,s.sun.y,s.sun.r*3.4);
      gr.addColorStop(0,s.sun.col); gr.addColorStop(1,'rgba(0,0,0,0)');
      c.globalAlpha=0.85; c.fillStyle=gr; c.beginPath(); c.arc(s.sun.x,s.sun.y,s.sun.r*3.4,0,6.283); c.fill();
      c.globalAlpha=1; c.fillStyle=s.sun.col; c.beginPath(); c.arc(s.sun.x,s.sun.y,s.sun.r,0,6.283); c.fill();
    }
    // far ridge + haze
    ridgeOn(c,HORIZON-30,58,3.1,s.far);
    c.globalAlpha=0.28; c.fillStyle=s.haze; c.fillRect(0,HORIZON-52,VW,52); c.globalAlpha=1;
  });
  fgLayer=makeLayer(function(c){
    ridgeOn(c,HORIZON-6,34,7.7,s.mid);
    var t;
    if(idx===0){
      for(t=0;t<6;t++) pineOn(c,40+t*112+((t*37)%40),HORIZON+2,44+((t*29)%26),16+(t%3)*3,'#1c5a24','#155020',false);
    } else if(idx===1){
      c.strokeStyle='#1a2a1c'; c.lineWidth=2.4; c.lineCap='round';
      for(i=0;i<26;i++){ var x=(i*61.7)%VW, hh=20+((i*29)%30);
        c.beginPath(); c.moveTo(x,HORIZON+10); c.quadraticCurveTo(x+3,HORIZON-hh*0.5,x-2,HORIZON-hh); c.stroke(); }
      c.fillStyle='#16231a'; c.fillRect(0,HORIZON+8,VW,VH-HORIZON-8);
    } else if(idx===2){
      for(t=0;t<4;t++){ var px=70+t*170; tri(c,px-70,HORIZON+4,px,HORIZON-96-((t*31)%30),px+70,HORIZON+4); c.fillStyle='#6b7390'; c.fill();
        tri(c,px-30,HORIZON-58-((t*31)%30),px,HORIZON-96-((t*31)%30),px+30,HORIZON-58-((t*31)%30)); c.fillStyle='#f2f6ff'; c.fill(); }
      pineOn(c,34,HORIZON+4,52,18,'#1b3a2c','#14301f',false);
      pineOn(c,606,HORIZON+4,58,20,'#1b3a2c','#14301f',false);
    } else if(idx===3){
      function mesa(x,w,h,col){ c.fillStyle=col; c.beginPath(); c.moveTo(x,HORIZON+30); c.lineTo(x+12,HORIZON-h); c.lineTo(x+w-12,HORIZON-h); c.lineTo(x+w,HORIZON+30); c.closePath(); c.fill(); }
      mesa(-20,190,52,'#5c2a17'); mesa(150,160,74,'#76341c'); mesa(390,210,64,'#4a2012'); mesa(300,150,44,'#8a3f20');
      c.globalAlpha=0.2; c.fillStyle='#ffb066'; c.fillRect(0,HORIZON-8,VW,10); c.globalAlpha=1;
    } else {
      for(t=0;t<5;t++) pineOn(c,46+t*130+((t*53)%50),HORIZON+4,52+((t*29)%28),18+(t%3)*4,'#1b3a2c','#25523b',true);
    }
    if(s.water){
      c.fillStyle=idx===1?'#3a3350':'#40506b'; c.fillRect(0,HORIZON,VW,VH-HORIZON);
      c.fillStyle='rgba(255,255,255,0.10)'; c.fillRect(0,HORIZON,VW,3);
    } else {
      c.fillStyle=s.ground; c.fillRect(0,HORIZON,VW,VH-HORIZON);
      c.fillStyle=s.ground2; c.fillRect(0,HORIZON+44,VW,VH-HORIZON-44);
    }
  });
}
function drawLayers(){
  var par=(cross.x-VW/2)/VW;
  var bx=-par*5, fx=-par*11;
  if(ctx){
    ctx.fillStyle='#000'; ctx.fillRect(-40,-40,VW+80,VH+80);
    if(bgLayer) ctx.drawImage(bgLayer,bx,0); else { ctx.fillStyle='#204060'; ctx.fillRect(0,0,VW,HORIZON); }
    if(fgLayer) ctx.drawImage(fgLayer,fx,0); else { ctx.fillStyle='#2b6f2b'; ctx.fillRect(0,HORIZON,VW,VH-HORIZON); }
  }
}
function drawWaterShimmer(){
  var s=SCENES[sceneIndex]; if(!s.water) return;
  var i;
  ctx.strokeStyle=sceneIndex===1?'rgba(255,170,90,0.35)':'rgba(255,230,245,0.28)';
  ctx.lineWidth=1.3;
  for(i=0;i<9;i++){
    var y=HORIZON+8+i*15, o=Math.sin(tG*0.0016+i*1.3)*12;
    ctx.beginPath(); ctx.moveTo(o+(i*67)%VW,y); ctx.lineTo(o+90+(i*67)%VW,y); ctx.stroke();
  }
  if(s.sun){
    ctx.globalAlpha=0.25; ctx.fillStyle=s.sun.col;
    ctx.fillRect(s.sun.x+layerOff-24+Math.sin(tG*0.002)*4, HORIZON+6, 48, VH-HORIZON-10);
    ctx.globalAlpha=1;
  }
}
function drawGrassFringe(){
  var s=SCENES[sceneIndex], i;
  var col=(sceneIndex===4)?'#dfe9ff':(sceneIndex===3?'#6e2a18':(sceneIndex===1?'#16231a':'#2b6f2b'));
  ctx.save();
  ctx.strokeStyle=col; ctx.lineCap='round';
  for(i=0;i<26;i++){
    var x=(i*41.7+Math.sin(tG*0.0004+i)*10)% (VW+60) - 30;
    var h=14+((i*37)%22);
    var sway=Math.sin(tG*0.0011+i*0.7)*3.2;
    ctx.lineWidth=2+((i%3)*0.6);
    ctx.beginPath(); ctx.moveTo(x,VH+2);
    ctx.quadraticCurveTo(x+sway*0.5, VH-h*0.55, x+sway, VH-h);
    ctx.stroke();
  }
  // a soft darkening right at the bottom edge so the fringe reads as depth
  var g=ctx.createLinearGradient(0,VH-34,0,VH);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.30)');
  ctx.fillStyle=g; ctx.fillRect(0,VH-34,VW,34);
  ctx.restore();
}

function updateWeather(dt){
  var kind=SCENES[sceneIndex].weather, i;
  for(i=0;i<weather.length;i++){
    var p=weather[i];
    p.x+=p.vx*dt;
    if(kind==='snow'||kind==='dust'||kind==='fireflies') p.y+=p.vy*dt;
    if(kind==='fireflies') p.p+=dt*0.002;
    if(p.x<-40) p.x=VW+40; if(p.x>VW+40) p.x=-40;
    if(kind==='snow'&&p.y>VH+4){ p.y=-4; p.x=Math.random()*VW; }
  }
}
function drawWeatherFx(){

  for(i=0;i<weather.length;i++){
    var p=weather[i];
    if(kind==='clouds'){
      ctx.globalAlpha=p.a; ctx.fillStyle='#ffffff';
      rr(ctx,p.x,p.y,p.s*1.7,p.s*0.6,p.s*0.3); ctx.fill();
      rr(ctx,p.x+p.s*0.5,p.y-p.s*0.3,p.s*0.9,p.s*0.55,p.s*0.28); ctx.fill();
    } else if(kind==='fireflies'){

    } else if(kind==='birds'){
      ctx.strokeStyle='rgba(30,30,40,'+p.a+')'; ctx.lineWidth=1.4;

    } else if(kind==='dust'){
      ctx.globalAlpha=p.a; ctx.fillStyle='#ffd9a8'; ctx.fillRect(p.x,p.y,p.s,p.s);
    } else {
      ctx.globalAlpha=p.a; ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;

function quota(){ return DIFFS[diffIndex].thr; }

function spawnDuck(forceSpecies){
  var fromLeft=Math.random()<0.5;
  var y=80+Math.random()*(HORIZON-44);
  var sp;
  if(forceSpecies!=null) sp=SPECIES[forceSpecies];
  else {
    var roll=Math.random();
    if(roll<0.06) sp=SPECIES[3];
    else if(roll<0.34) sp=SPECIES[2];
    else if(roll<0.62) sp=SPECIES[1];
    else sp=SPECIES[0];
  }
  var baseSpd=0.098*DIFFS[diffIndex].spd*(1+(round-1)*0.055)*sp.spd*(0.85+Math.random()*0.3);
  var d={
    sp:sp, x:fromLeft?-26:VW+26, y:y, baseY:y,
    vx:(fromLeft?1:-1)*baseSpd, t:Math.random()*4, phase:Math.random()*6.28,
    wing:Math.random()*6.28, panic:0, dead:false, esc:false, gone:false, trail:[]
  };
  return d;
}
function updateDuckPath(dk,slow,dt){
  dk.t+=dt*slow*0.001;
  if(dk.panic>0) dk.panic=Math.max(0,dk.panic-dt*0.0007);
  var p=dk.sp.path;
  if(p==='weave') dk.y=dk.baseY+Math.sin(dk.t*3.2+dk.phase)*18;
  else if(p==='zigzag') dk.y=dk.baseY+(((dk.t*2.4+dk.phase)%2)<1?1:-1)*24;
  else if(p==='erratic'){ if(Math.random()<0.03) dk.phase=Math.random()*6.28; dk.y=dk.baseY+Math.sin(dk.t*6+dk.phase)*14; }
  else dk.y=dk.baseY+Math.sin(dk.t*1.2)*8;
  if(dk.y<66) dk.y=66; if(dk.y>HORIZON-18) dk.y=HORIZON-18;
  dk.x+=dk.vx*dt*slow*(1+dk.panic*0.9);
  dk.bank=clamp((dk.y-(dk.lastY===undefined?dk.y:dk.lastY))*0.10,-0.45,0.45);
  dk.lastY=dk.y;
  dk.wing+=dt*slow*0.017;
  dk.trail.push({x:dk.x,y:dk.y});
  if(dk.trail.length>6) dk.trail.shift();
  if(dk.x<-40||dk.x>VW+40) dk.esc=true;
}

/* ---------------- ammo ---------------- */
function startReload(){
  if(reloading||state!=='playing') return;
  if(shellsLeft>=GUNS[gunIndex].mag) return;
  reloading=true; reloadT=RELOAD_MS; sndReloadStart(); updateHud();
}
function finishReload(){
  reloading=false; shellsLeft=GUNS[gunIndex].mag; sndReloadDone(); updateHud();
}
function refundShell(){ shellsLeft=Math.min(GUNS[gunIndex].mag, shellsLeft+1); }

/* ---------------- firing ---------------- */
function fire(lx,ly){
  if(state!=='playing'||reloading||fireCd>0) return;
  var g=GUNS[gunIndex];
  if(shellsLeft<=0){ sndClick(); popText(lx,ly-18,'EMPTY!','#ff5a5a'); startReload(); return; }
  if(introT>0) introT=0;
  shellsLeft--; shots++; fireCd=g.rate;
  muzzle=1; recoil=1; shake=Math.min(9,2.2+g.pellets*0.5); cross.pulse=1; hitFlash=0.25;
  sndShot(); ejectCasing();
  var pts=[{x:lx,y:ly}], i;
  for(i=0;i<g.pellets;i++) pts.push({ x:lx+(Math.random()+Math.random()-1)*g.spread, y:ly+(Math.random()+Math.random()-1)*g.spread*0.72 });
  var hitAny=false, k, q;
  for(k=0;k<pts.length;k++){
    var p=pts[k];
    for(i=0;i<ducks.length;i++){
      var dk=ducks[i];
      if(dk.dead) continue;
      var dx=p.x-dk.x, dy=p.y-dk.y, dr=dk.sp.r;
      if(dx*dx+dy*dy<dr*dr){ dk.dead=true; hitAny=true; onDuckHit(dk); }
    }
    for(q=0;q<powerups.length;q++){
      var pu=powerups[q];
      if(pu.dead) continue;
      var px=p.x-pu.x, py=p.y-pu.y;
      if(px*px+py*py<34*34){ pu.dead=true; hitAny=true; onPowerup(pu); }
    }
  }
  if(!hitAny){
    buzz(12);
    combo=0; comboTimer=0; dog.misses++;
    missMark={ x:lx, y:ly, t:0 };
    dustPuff(lx,ly);
    for(i=0;i<ducks.length;i++) ducks[i].panic=Math.min(1.8,ducks[i].panic+0.8);
    if(dog.misses>=3){ dog.state='laugh'; dog.t=1600; sndLaugh(); dog.misses=0; }
  } else {
    dog.misses=0;
  }
  var keep=[];
  for(k=0;k<ducks.length;k++){
    var dd=ducks[k];
    if(dd.dead) falling.push({ x:dd.x,y:dd.y,vx:dd.vx*0.5,vy:-0.05,rot:0,vr:0.006,t:0,sp:dd.sp,landed:false });
    else keep.push(dd);
  }
  ducks=keep;
  if(shellsLeft<=0) startReload();
  updateHud();
}
function onDuckHit(dk){
  hitStop=dk.sp.gold?130:80;   // frozen beat, same frame as the flash + sound + feathers
  buzz(dk.sp.gold?60:25);      // a golden duck gets a longer rumble
  combo++; comboTimer=2800; if(combo>bestCombo) bestCombo=combo;
  var mult=1+Math.floor(combo/3); if(mult>5) mult=5;
  var base=dk.sp.pts;
  var ptsV=Math.round(base*DIFFS[diffIndex].mul*mult*(dblT>0?2:1));
  score+=ptsV; hits++; ducksDown++; refundShell();
  if(score>best){ best=score; save.best=best; if(best>=25000) save.goldUnlocked=true; writeSave(); }
  hitMark={ x:dk.x, y:dk.y, t:0, gold:!!dk.sp.gold };
  popText(dk.x,dk.y-14,'+'+ptsV,dk.sp.gold?'#ffe071':(dblT>0?'#8ad4ff':'#ffe58a'));
  if(combo>=3) popText(dk.x,dk.y-36,'COMBO x'+mult,'#6dffa1');
  feathers(dk.x,dk.y,dk.sp.cols,dk.sp.gold?20:14);
  if(SCENES[sceneIndex].water) splashFx(dk.x,dk.y);
  if(dk.sp.gold){ sndSparkle(); dog.state='stun'; dog.t=1600; }
  else sndQuack();
}
function onPowerup(pu){
  sndPower(); sparkles(pu.x,pu.y,'#ffe071');
  if(pu.type==='slow'){ slowT=4200; popText(pu.x,pu.y,'SLOW-MO','#8ad4ff'); }
  else if(pu.type==='shells'){ shellsLeft=Math.min(GUNS[gunIndex].mag+2,shellsLeft+3); reloading=false; popText(pu.x,pu.y,'+3 SHELLS','#6dffa1'); }
  else if(pu.type==='dbl'){ dblT=10000; popText(pu.x,pu.y,'DOUBLE PTS','#ffd34d'); }
  else if(pu.type==='flock'){
    popText(pu.x,pu.y,'FLOCK!','#ff9ad4');
    var i; for(i=0;i<3;i++){ if(attempts<ROUND_TARGET){ attempts++; ducks.push(spawnDuck(null)); } }
  }
  else { score+=750; popText(pu.x,pu.y,'+750','#ffe071'); if(score>best){ best=score; save.best=best; writeSave(); } }
  updateHud();
}
function spawnPowerup(){
  var types=['slow','shells','dbl','bonus','flock'];
  var type=types[(Math.random()*types.length)|0];
  var col=type==='slow'?'#8ad4ff':type==='shells'?'#6dffa1':type==='dbl'?'#ffd34d':type==='flock'?'#ff9ad4':'#ffe071';
  powerups.push({ x:VW*(0.2+Math.random()*0.6), y:Math.max(90,HORIZON*0.35)+Math.random()*HORIZON*0.3, age:0, life:8000,
    vx:(Math.random()<0.5?1:-1)*0.02, type:type, col:col, dead:false, t:Math.random()*6.28 });
}

/* ---------------- round flow ---------------- */
function sceneForRound(r){ return Math.floor((r-1)/3)%SCENES.length; }
function startRound(){
  ducksDown=0; attempts=0; shots=0; hits=0; escapes=0; bestCombo=0; combo=0; comboTimer=0;
  shellsLeft=GUNS[gunIndex].mag; reloading=false; reloadT=0;
  spawnTimer=700; introT=1600; fireCd=0;
  ducks=[]; falling=[]; powerups=[];
  dog.state='pop'; dog.t=1400; dog.duck=null; dog.misses=0;
  cross.x=VW/2; cross.y=VH/2-40;
  state='playing'; hidePanel();
  updateHud();
}
function newGame(m){
  if(m==='hunt'||m==='endless') mode=m;
  score=0; round=1; slowT=0; dblT=0; shake=0; particles=[]; popups=[]; casings=[];
  bestCombo=0; areaStars=0; clutchShown=false;
  hidePanel();
  setScene(sceneForRound(1));
  startRound();
}
function retryArea(){
  score=Math.max(0, score); // keep banked score but retry the area
  hidePanel();
  setScene(sceneForRound(round));
  startRound();
}
function setScene(idx){
  sceneIndex=idx%SCENES.length;
  buildSceneLayers(sceneIndex);
  initWeather();
}
function endRound(){
  if(ducksDown>=quota()){
    state='results'; sndJingle();
    var acc=shots>0?Math.round(hits/shots*100):0;
    var medal = acc>=80?'GOLD MEDAL':(acc>=55?'SILVER MEDAL':'BRONZE MEDAL');
    areaStars=starsForAcc(acc);
    var prev=save.stars[round]||0;
    if(areaStars>prev){ save.stars[round]=areaStars; writeSave(); }
    var rows=[['DUCKS HIT',hits+' / '+attempts],['ESCAPED',String(escapes)],['SHOTS FIRED',String(shots)],
      ['ACCURACY',acc+'%'],['BEST COMBO','x'+(1+Math.floor(bestCombo/3))],['ROUND SCORE',String(score)],
      ['STARS EARNED',starsText(areaStars)],['AREA BEST',starsText(Math.max(prev,areaStars))],
      ['TOTAL STARS',totalStars()+' / '+maxStars()]];
    if(mode==='endless'){
      showPanel('WAVE CLEAR','WAVE '+round+' CLEARED \u00b7 ENDLESS',rows,medal,
        [{label:'NEXT WAVE',primary:true,fn:function(){ advanceRound(); }},
         {label:'STOP HERE',fn:function(){ gotoTitle(); }}]);
    } else {
      showPanel('AREA CLEAR','ROUND '+round+' OF '+ROUNDS_TO_WIN,rows,medal,
        [{label:'NEXT AREA',primary:true,fn:function(){ advanceRound(); }}]);
    }
  } else {
    state='gameover'; sndSting();
    if(score>best){ best=score; save.best=best; }
    if(mode==='endless'&&round>(save.endlessBest||0)) save.endlessBest=round;
    writeSave();
    var acc2=shots>0?Math.round(hits/shots*100):0;
    var rows2=[['SCORE',String(score)],['BEST',String(best)],['ACCURACY',acc2+'%']];
    if(mode==='endless') rows2.push(['WAVE REACHED',String(round)],['BEST WAVE',String(save.endlessBest||0)]);
    rows2.push(['TOTAL STARS',totalStars()+' / '+maxStars()]);
    showPanel('GAME OVER','QUOTA MISSED \u2014 '+ducksDown+' / '+quota()+' DUCKS',rows2,'',
      [{label:'RETRY AREA',primary:true,fn:function(){ retryArea(); }},
       {label:'MAIN MENU',fn:function(){ gotoTitle(); }}]);
    updateHud();
  }
}
function advanceRound(){
  if(state!=='results') return;
  round++;
  if(mode!=='endless'&&round>ROUNDS_TO_WIN){
    state='win'; sndTrophy();
    if(score>best){ best=score; save.best=best; } writeSave();
    showPanel('TROPHY!','ALL '+ROUNDS_TO_WIN+' AREAS CLEARED',
      [['FINAL SCORE',String(score)],['BEST SCORE',String(best)]],
      'GOLD TROPHY',[{label:'PLAY AGAIN',primary:true,fn:function(){ newGame(); }}]);
    updateHud();
    return;
  }
  setScene(sceneForRound(round));
  startRound();
}
function pauseMenu(){
  showPanel('PAUSED','TAKE A BREATH',[['VIBRATION',haptics?'ON':'OFF']],'',
    [{label:'RESUME',primary:true,fn:function(){ state='playing'; hidePanel(); }},
     {label:'RESTART',fn:function(){ newGame(); }},
     {label:'VIBRATION '+(haptics?'ON':'OFF'),fn:function(){ setHaptics(!haptics); pauseMenu(); }},
     {label:'MAIN MENU',fn:function(){ gotoTitle(); }}]);
}
function togglePause(){
  if(state==='playing'){ prevState='playing'; state='paused'; pauseMenu();
  } else if(state==='paused'){ state='playing'; hidePanel(); }
}

/* ---------------- input ---------------- */
function unlockAudio(){ if(!audioReady&&!muted) initAudio(); }
function onPointerDown(ev){
  unlockAudio();
  var p=toLocal2(ev.clientX,ev.clientY);
  cross.x=clamp(p.x,0,VW); cross.y=clamp(p.y,0,VH); cross.pulse=1;
  if(state!=='playing') return;
  fire(cross.x,cross.y);
}
function onPointerMove(ev){
  var p=toLocal2(ev.clientX,ev.clientY);
  cross.x=clamp(p.x,0,VW); cross.y=clamp(p.y,0,VH);
}
function onKey(e){
  var k=e.key||'';
  if(k==='r'||k==='R'){ startReload(); }
  else if(k==='p'||k==='P'||k==='Escape'){ togglePause(); }
}
function cycleGun(){
  var n=GUNS.length, i;
  for(i=1;i<=n;i++){
    var idx=(gunIndex+i)%n;
    if(!gunUnlocked(idx)) continue;
    gunIndex=idx; break;
  }
  shellsLeft=GUNS[gunIndex].mag; reloading=false;
  popText(VW/2,130,GUNS[gunIndex].name.toUpperCase(),'#ffd34d');
  updateHud();
}
function cycleDiff(){ diffIndex=(diffIndex+1)%DIFFS.length; updateHud(); }
function setHaptics(v){
  haptics=v;
  try{ if(typeof localStorage!=='undefined'&&localStorage) localStorage.setItem('duckhunt_haptics',v?'1':'0'); }catch(e){}
}
function toggleMute(){
  muted=!muted;
  try{ if(typeof localStorage!=='undefined'&&localStorage) localStorage.setItem('duckhunt_muted',muted?'1':'0'); }catch(e){}
  if(!muted) initAudio();
  updateHud();
}

/* ---------------- update ---------------- */
function update(dt){
  tG+=dt;
  updateFever(dt); drawFeverTrails();
  if(fireCd>0) fireCd-=dt;
  if(shake>0) shake=Math.max(0,shake-dt*0.03);
  if(muzzle>0) muzzle=Math.max(0,muzzle-dt*0.0045);
  if(recoil>0) recoil=Math.max(0,recoil-dt*0.005);
  if(cross.pulse>0) cross.pulse=Math.max(0,cross.pulse-dt*0.004);
  if(hitFlash>0) hitFlash=Math.max(0,hitFlash-dt*0.004);
  if(slowT>0) slowT=Math.max(0,slowT-dt);
  if(dblT>0) dblT=Math.max(0,dblT-dt);
  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) combo=0; }
  if(dog.t>0){ dog.t-=dt; if(dog.t<=0&&dog.state!=='idle'){ dog.state='idle'; dog.duck=null; } }
  if(reloading){ reloadT-=dt; if(reloadT<=0) finishReload(); }
  if(hitMark){ hitMark.t+=dt; if(hitMark.t>500) hitMark=null; }
  if(missMark){ missMark.t+=dt; if(missMark.t>500) missMark=null; }
  if(introT>0) introT-=dt;

  // Duck Time: the final duck of an area is slowed for one tense beat
  var clutch=(state==='playing'&&attempts>=ROUND_TARGET&&ducks.length===1&&!ducks[0].esc);
  var slow=slowT>0?0.42:(clutch?(hitStop>0?0.75:0.62):1);
  if(clutch&&!clutchShown){ clutchShown=true; popText(VW/2,120,'LAST DUCK!','#ff9ad4'); }
  if(!clutch) clutchShown=false;
  updateWeather(dt);

  if(state==='playing'&&introT<=0){
    spawnTimer-=dt;
    var maxConc=1+Math.floor((round-1)/3); if(maxConc>3) maxConc=3;
    if(spawnTimer<=0&&attempts<ROUND_TARGET&&ducks.length<maxConc){
      attempts++; ducks.push(spawnDuck(null));
      if(Math.random()<0.15) spawnPowerup();
      spawnTimer=Math.max(360,1350-round*52);
    }
    var i, escAny=false;
    for(i=0;i<ducks.length;i++){
      updateDuckPath(ducks[i],slow,dt);
      if(ducks[i].esc){ ducks[i].gone=true; escAny=true; }
    }
    if(escAny){
      escapes++; combo=0; comboTimer=0;
      dog.state='laugh'; dog.t=1300;
    }
    ducks=ducks.filter(function(d){ return !d.gone; });
    if(attempts>=ROUND_TARGET&&ducks.length===0) endRound();
  }

  var i2;
  for(i2=0;i2<powerups.length;i2++){
    var pu=powerups[i2]; pu.x+=pu.vx*dt; pu.t+=dt*0.006; pu.age=(pu.age||0)+dt;
    if(pu.x<VW*0.12||pu.x>VW*0.88) pu.vx=-pu.vx;
    if(pu.age>(pu.life||8000)) pu.dead=true;
  }
  powerups=powerups.filter(function(p){ return !p.dead; });

  for(i2=0;i2<falling.length;i2++){
    var fd=falling[i2];
    fd.t+=dt; fd.vy+=dt*0.0006; fd.y+=fd.vy*dt; fd.x+=fd.vx*dt; fd.rot+=fd.vr*dt*0.06;
    if(fd.y>=groundYAt(fd.x)){
      fd.y=groundYAt(fd.x);
      if(!fd.landed){ fd.landed=true; dog.state='retrieve'; dog.t=1700; dog.duck=fd; }
    }
  }
  falling=falling.filter(function(f){ return !(f.landed&&f.t>1100); });

  for(i2=0;i2<casings.length;i2++){
    var cs=casings[i2]; cs.t+=dt; cs.vy+=dt*0.0012; cs.x+=cs.vx*dt; cs.y+=cs.vy*dt; cs.rot+=cs.vr*dt*0.06;
  }
  casings=casings.filter(function(c){ return c.t<c.life; });

  for(i2=0;i2<particles.length;i2++){
    var pt=particles[i2]; pt.t+=dt; pt.vy+=pt.g*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.rot+=dt*0.008;
  }
  particles=particles.filter(function(p){ return p.t<p.life; });

  for(i2=0;i2<popups.length;i2++){ var po=popups[i2]; po.t+=dt; po.y-=dt*0.028; }
  popups=popups.filter(function(p){ return p.t<p.life; });
}
function groundYAt(x){ return Math.min(VH-8, HORIZON+60+Math.sin(x*0.01)*6); }

/* ---------------- render ---------------- */
function render(){
  if(!ctx) return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scaleS,0,0,scaleS,offX,offY);
  ctx.save();
  if(shake>0.2) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawLayers();
  drawAtmosphere();
  drawWaterShimmer();
  drawWeatherFx();
  drawGrassFringe();
  drawPowerups();
  drawFalling();
  drawDucksAll();
  drawParticles();
  drawDog();
  drawGun();
  drawCasings();
  drawFrontFrame();
  ctx.restore();
  drawCrosshair();
  drawMarkers();
  drawComboBar();
  drawReloadUI();
  drawPopups();
  drawIntroCard();
  if(state==='playing'&&attempts>=ROUND_TARGET&&ducks.length===1&&!ducks[0].esc){
    ctx.save();
    ctx.globalAlpha=0.22+0.08*Math.sin(tG*0.008);
    var vg=ctx.createRadialGradient(VW/2,VH/2,110,VW/2,VH/2,380);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(255,60,140,0.85)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
    ctx.restore();
  }
  if(hitFlash>0){ ctx.globalAlpha=hitFlash*0.5; ctx.fillStyle='#fff'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1; }
}
function drawPowerups(){
  var i;
  for(i=0;i<powerups.length;i++){
    var pu=powerups[i], bob=Math.sin(pu.t*2)*3;
    ctx.save(); ctx.translate(pu.x,pu.y+bob);
    if((pu.age||0)>6000&&Math.floor(pu.age/180)%2) ctx.globalAlpha=0.45;
    ctx.scale(1.2,1.2);
    ctx.globalAlpha=0.35; ctx.fillStyle=pu.col;
    ctx.beginPath(); ctx.arc(0,0,18,0,6.283); ctx.fill();
    ctx.globalAlpha=1; ctx.fillStyle='#0b0f16';
    ctx.beginPath(); ctx.arc(0,0,13,0,6.283); ctx.fill();
    ctx.fillStyle=pu.col; ctx.beginPath(); ctx.arc(0,0,10,0,6.283); ctx.fill();
    ctx.fillStyle='#0b0f16'; ctx.font='bold 9px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    var lab=pu.type==='slow'?'S':pu.type==='shells'?'AMMO':pu.type==='dbl'?'2X':pu.type==='flock'?'FLK':'$';
    ctx.fillText(lab,0,0.5);
    ctx.restore();
  }
}
var glowCv=null;
function glowSprite(){
  if(glowCv) return glowCv;
  var oc=offCanvas(); if(!oc) return null;
  var c=oc.getContext('2d'); if(!c) return null;
  var g=c.createRadialGradient(VW/2,VH/2,2,VW/2,VH/2,VW/2);
  g.addColorStop(0,'rgba(255,236,150,0.95)');
  g.addColorStop(0.35,'rgba(255,214,90,0.45)');
  g.addColorStop(1,'rgba(255,200,60,0)');
  c.fillStyle=g; c.fillRect(0,0,VW,VH);
  glowCv=oc; return glowCv;
}
function drawGlow(x,y,size){
  var g=glowSprite(); if(!g) return;
  ctx.save(); ctx.globalAlpha=0.75; ctx.drawImage(g,x-VW/2,y-VH/2,VW,VH); ctx.restore();
}
function feather(len,wid,col,ang,edge){
  ctx.save(); ctx.rotate(ang);
  ctx.fillStyle=col; ctx.strokeStyle=edge||'#111a26'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(0,-wid*0.5);
  ctx.bezierCurveTo(len*0.4,-wid*0.9,len*0.85,-wid*0.5,len,0);
  ctx.bezierCurveTo(len*0.8,wid*0.45,len*0.4,wid*0.8,0,wid*0.5);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawWing(cols,wingbar,u,scale,dark){
  /* wing hangs from shoulder at origin, feathers fan toward -x; u: 0 = up stroke, 1 = down stroke */
  var base=dark?mixHex(cols[1],'#000000',0.35):cols[1];
  var tip=dark?mixHex(cols[0],'#000000',0.45):mixHex(cols[1],'#000000',0.18);
  var i, n=7;
  var spread=0.5+0.35*Math.sin(u*Math.PI);
  for(i=0;i<n;i++){
    var t=i/(n-1);
    feather((30-t*9)*scale,8.5*scale,i<3?tip:base,Math.PI+(t-0.5)*spread*1.6+0.05,null);
  }
  // coverts + speculum stripe
  ctx.fillStyle=dark?mixHex(cols[0],'#000000',0.35):cols[0]; ctx.strokeStyle='#111a26'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.ellipse(-8*scale,0,13*scale,6.5*scale,0.05,0,6.283); ctx.fill(); ctx.stroke();
  if(wingbar&&!dark){ ctx.fillStyle=wingbar; ctx.beginPath(); ctx.ellipse(-12*scale,1.2*scale,9*scale,2.4*scale,0.1,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.fillRect(-21*scale,-1*scale,1.6*scale,4.4*scale); }
}
function drawDuckBody(cols,headCol,wingbar,gold,flap,beakCol,bank){
  var i, wf=(Math.sin(flap*Math.PI)+1)/2, wr=0.95-wf*1.55;
  var head=headCol||cols[0], beak=beakCol||cols[2], line='#111a26';
  ctx.save(); ctx.rotate(bank||0); ctx.lineJoin='round'; ctx.lineCap='round';
  if(gold){
    ctx.fillStyle='rgba(255,224,113,0.30)'; ctx.beginPath(); ctx.ellipse(0,0,31,16,-0.1,0,6.283); ctx.fill();
    ctx.strokeStyle='rgba(255,244,190,0.75)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.ellipse(0,0,32,17,-0.1,0,6.283); ctx.stroke();
  }
  // far wing (behind body, darker, slightly out of phase)
  ctx.save(); ctx.translate(2,-5); ctx.rotate(0.95-Math.min(1,wf+0.18)*1.55+0.12); drawWing(cols,wingbar,wf,0.92,true); ctx.restore();
  // webbed feet trailing
  ctx.strokeStyle=line; ctx.lineWidth=1.3; ctx.fillStyle='#e8892a';
  ctx.beginPath(); ctx.moveTo(-9,10); ctx.lineTo(-17,15); ctx.lineTo(-13,17); ctx.lineTo(-18,19); ctx.lineTo(-8,15); ctx.closePath(); ctx.fill(); ctx.stroke();
  // tail: pointed with a little upturned curl
  ctx.fillStyle=cols[1]; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(-14,-2); ctx.bezierCurveTo(-24,-4,-30,-7,-35,-11); ctx.bezierCurveTo(-33,-3,-29,3,-17,8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle=mixHex(cols[1],'#000000',0.3); ctx.beginPath(); ctx.moveTo(-15,2); ctx.lineTo(-33,-1); ctx.lineTo(-17,8); ctx.closePath(); ctx.fill(); ctx.stroke();
  // body: back arc, rounded chest, belly
  var bg=ctx.createLinearGradient(0,-12,0,16);
  bg.addColorStop(0,mixHex(cols[0],'#ffffff',0.22)); bg.addColorStop(0.5,cols[0]); bg.addColorStop(1,mixHex(cols[0],'#000000',0.38));
  ctx.fillStyle=bg; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-20,2);
  ctx.bezierCurveTo(-18,-9,-6,-13,6,-10);
  ctx.bezierCurveTo(15,-8,21,-2,21,5);
  ctx.bezierCurveTo(21,13,10,17,-3,15);
  ctx.bezierCurveTo(-13,13,-21,9,-20,2); ctx.closePath(); ctx.fill(); ctx.stroke();
  // chest patch + feather scallops
  ctx.save(); ctx.clip();
  ctx.fillStyle=gold?'#fff2b0':mixHex(cols[1],'#b5532a',0.55); ctx.globalAlpha=0.7;
  ctx.beginPath(); ctx.ellipse(15,5,9,10,0,0,6.283); ctx.fill(); ctx.globalAlpha=0.22; ctx.strokeStyle='#000'; ctx.lineWidth=1;
  for(i=0;i<9;i++){ ctx.beginPath(); ctx.arc(-14+i*3.6,9+(i%2)*2.5,2.6,0.2,2.9); ctx.stroke(); }
  ctx.globalAlpha=1; ctx.restore();
  // neck ring + neck
  ctx.fillStyle=head; ctx.strokeStyle=line; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(8,-8); ctx.bezierCurveTo(10,-14,12,-17,15,-19); ctx.lineTo(21,-13); ctx.bezierCurveTo(21,-8,20,-3,18,1); ctx.closePath(); ctx.fill(); ctx.stroke();
  if(!gold){ ctx.fillStyle='#f4f1e6'; ctx.beginPath(); ctx.moveTo(10,-6); ctx.quadraticCurveTo(15,-3,20,-4); ctx.lineTo(19.6,-1); ctx.quadraticCurveTo(14,0,9,-2); ctx.closePath(); ctx.fill(); }
  // head with sheen
  var hg=ctx.createRadialGradient(15,-23,1,17,-20,10);
  hg.addColorStop(0,mixHex(head,'#ffffff',0.38)); hg.addColorStop(1,head);
  ctx.fillStyle=hg; ctx.beginPath(); ctx.moveTo(10,-19); ctx.bezierCurveTo(10,-27,20,-29,24,-23); ctx.bezierCurveTo(26,-20,26,-16,22,-14); ctx.bezierCurveTo(16,-12,10,-13,10,-19); ctx.closePath(); ctx.fill(); ctx.stroke();
  // bill: flat spatula, highlight, nail

/* ================= FACELIFT: atmosphere, god rays, framing foliage, GOLDEN FEVER twist =================

   golden sparkle trails behind every duck and a glowing frame. Miss or let one escape and it cools. */
var fever=0;
function updateFever(dt){
  var target=(state==='playing')?clamp((combo-2)/5,0,1):0;
  fever+= (target-fever)*Math.min(1,dt*0.004);
  if(fever<0.001) fever=0;
}
function drawAtmosphere(){
  var sc=SCENES[sceneIndex], i;
  // horizon haze: soft band blending sky into ground
  var hz=ctx.createLinearGradient(0,HORIZON-70,0,HORIZON+26);
  hz.addColorStop(0,'rgba(255,255,255,0)'); hz.addColorStop(0.7,'rgba(255,240,220,0.16)'); hz.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hz; ctx.fillRect(0,HORIZON-70,VW,96);
  // god rays from the sun / moon
  if(sc.sun){
    var sx=sc.sun.x+layerOff, sy=sc.sun.y;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(i=0;i<5;i++){
      var a=1.1+i*0.28+Math.sin(tG*0.0003+i*1.7)*0.06;
      var g=ctx.createLinearGradient(sx,sy,sx+Math.cos(a)*520,sy+Math.sin(a)*520);
      g.addColorStop(0,'rgba(255,235,170,'+(0.10+fever*0.10)+')'); g.addColorStop(1,'rgba(255,235,170,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(sx,sy);
      ctx.lineTo(sx+Math.cos(a-0.06)*620,sy+Math.sin(a-0.06)*620); ctx.lineTo(sx+Math.cos(a+0.06)*620,sy+Math.sin(a+0.06)*620); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // golden fever: warm wash over the world
  if(fever>0){
    ctx.save(); ctx.globalAlpha=0.16*fever; ctx.fillStyle='#ff9a2e'; ctx.fillRect(0,0,VW,VH); ctx.restore();
  }

function drawFrontFrame(){
  var t=tG*0.0012, i, W=VW, H=VH;
  // big out-of-focus leaves framing the bottom corners = depth
  ctx.save();
  for(var side=0;side<2;side++){
    var bx=side?W:0, dir=side?-1:1;
    for(i=0;i<5;i++){
      var ang=-0.5-i*0.32+Math.sin(t+i+side*2)*0.05;
      var len=70+i*16;
      ctx.save(); ctx.translate(bx+dir*(8+i*6),H+6); ctx.scale(dir,1); ctx.rotate(ang);
      var lg=ctx.createLinearGradient(0,0,len,0);

function drawCrosshair(){
  if(state==='title') return;
  var pulse=1+cross.pulse*0.35;
  var col=dblT>0?'#ffd34d':'#ffffff';
  ctx.save(); ctx.translate(cross.x,cross.y);
  ctx.globalAlpha=0.95; ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineCap='round';
  var r=13*pulse;
  ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,3,0,6.283); ctx.stroke();
  var l=9;
  ctx.beginPath();
  ctx.moveTo(-r-l,0); ctx.lineTo(-r+3,0); ctx.moveTo(r-3,0); ctx.lineTo(r+l,0);
  ctx.moveTo(0,-r-l); ctx.lineTo(0,-r+3); ctx.moveTo(0,r-3); ctx.lineTo(0,r+l);
  ctx.stroke();
  ctx.globalAlpha=1; ctx.restore();
}
function drawIntroCard(){
  if(introT<=0||state!=='playing') return;
  var a=clamp(introT/500,0,1)*clamp((1600-introT)/300,0,1);
  var iris=Math.max(0.1,1-clamp((1600-introT)/900,0,1));
  ctx.save();
  ctx.globalAlpha=0.55*a;
  ctx.fillStyle='#04060a';
  ctx.beginPath(); ctx.rect(0,0,VW,VH);
  ctx.arc(VW/2,VH/2-30,340*iris+60,0,6.283,true); ctx.fill('evenodd');
  ctx.globalAlpha=a;
  ctx.fillStyle='#ffd34d'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 26px ui-monospace, monospace';
  ctx.fillText('AREA '+((sceneIndex%SCENES.length)+1)+' — '+SCENES[sceneIndex].name.toUpperCase(),VW/2,158);
  ctx.fillStyle='#eaf3ff'; ctx.font='bold 13px ui-monospace, monospace';
  ctx.fillText(DIFFS[diffIndex].name.toUpperCase()+' · QUOTA '+quota()+' OF '+ROUND_TARGET+' DUCKS',VW/2,188);
  ctx.restore();
}

/* ---------------- loop ---------------- */
function loop(ts){
  var now=(typeof ts==='number'&&isFinite(ts))?ts:performance.now();
  if(!lastNow) lastNow=now;
  var dt=now-lastNow; lastNow=now;
  if(!isFinite(dt)||dt<0) dt=0;
  if(dt>60) dt=60;
  // hit-stop: freeze the whole world for a beat so an impact actually registers
  if(hitStop>0){ hitStop=Math.max(0,hitStop-dt); dt=0; }
  if(state!=='paused') update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
function gotoTitle(){
  state='title';
  mode='hunt';
  ducks=[]; falling=[]; powerups=[]; particles=[]; popups=[]; casings=[];
  setScene(0);
  updateHud();
  var arsenal='';
  for(var i=0;i<GUNS.length;i++){
    arsenal+=(gunUnlocked(i)?'\u2714 ':'\uD83D\uDD12 ')+GUNS[i].name;
    if(!gunUnlocked(i)) arsenal+=' ('+GUNS[i].req+'\u2605)';
    if(i<GUNS.length-1) arsenal+='  \u00b7  ';
  }
  showPanel('DUCK HUNT','TAP THE FIELD TO SHOOT \u00b7 HIT DUCKS REFUND A SHELL',
    [['QUOTA',quota()+' DUCKS PER ROUND'],['AREAS',String(ROUNDS_TO_WIN)],['BEST SCORE',String(best)],
     ['STARS',totalStars()+' / '+maxStars()],['ENDLESS BEST','WAVE '+(save.endlessBest||0)],
     ['ARSENAL',arsenal]],
    '',
    [{label:'START HUNT',primary:true,fn:function(){ unlockAudio(); newGame('hunt'); }},
     {label:'ENDLESS',fn:function(){ unlockAudio(); newGame('endless'); }},
     {label:'VIBRATION '+(haptics?'ON':'OFF'),fn:function(){ setHaptics(!haptics); gotoTitle(); }}]);
}
function boot(){
  loadSave(); best=save.best||0;
  try{ if(typeof localStorage!=='undefined'&&localStorage&&localStorage.getItem('duckhunt_muted')==='1') muted=true; }catch(e){}
  try{ if(typeof localStorage!=='undefined'&&localStorage&&localStorage.getItem('duckhunt_haptics')==='0') haptics=false; }catch(e){}
  resize();
  if(window.addEventListener){
    window.addEventListener('resize',resize);
    window.addEventListener('keydown',onKey);
  }
  if(cv){
    cv.addEventListener('pointerdown',onPointerDown);
    cv.addEventListener('pointermove',onPointerMove);
  }
  try{
    if(typeof ResizeObserver!=='undefined'&&E('stage')){ new ResizeObserver(function(){ resize(); }).observe(E('stage')); }
  }catch(e){}
  if(bStart) bStart.onclick=function(){ unlockAudio(); newGame(); };
  if(bGun) bGun.onclick=function(){ cycleGun(); };
  if(bDiff) bDiff.onclick=function(){ cycleDiff(); };
  if(bReload) bReload.onclick=function(){ unlockAudio(); startReload(); };
  if(bPause) bPause.onclick=function(){ togglePause(); };
  if(bMute) bMute.onclick=function(){ toggleMute(); };
  setScene(0);
  gotoTitle();
  requestAnimationFrame(loop);
}
boot();

/* ---------------- debug hook ---------------- */
if(typeof location!=='undefined'&&/[?&]debug=1/.test(location.search)) window.__hunt={
  state:function(){
    return {
      state:state, score:score, round:round, ducksAlive:ducks.length,
      shells:shellsLeft, reloading:reloading,
      gun:GUNS[gunIndex].name, scene:SCENES[sceneIndex].name, difficulty:DIFFS[diffIndex].name,
      quota:quota(), down:ducksDown, attempts:attempts,
      ducks:ducks.map(function(d){ return { x:Math.round(d.x), y:Math.round(d.y), species:d.sp.name }; })
    };
  },
  spawn:function(){
    if(state==='results'){ advanceRound(); }
    if(state!=='playing'){ state='playing'; hidePanel(); introT=0; }
    reloading=false; shellsLeft=GUNS[gunIndex].mag;
    if(attempts<ROUND_TARGET) attempts++;
    ducks.push(spawnDuck(0));
    updateHud();
    return true;
  },
  reset:function(){ newGame(); return true; }
};

})();
</script>
