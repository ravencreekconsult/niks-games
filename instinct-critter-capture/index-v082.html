 function rosterCard(body,m,i,stored){const card=document.createElement('div');card.className='roster';const s=SPECIES[m.id],st=stats(m);card.innerHTML='<div class="roster-top"><div class="detail"><b>'+s.name+' · L'+m.level+(i===0&&!stored?' · LEAD':'')+'</b><p>'+s.types.join(' / ')+' · '+m.nature+'<br>'+m.hp+'/'+st.hp+' HP'+(m.status?' · '+m.status:'')+'<br>XP '+m.xp+'/'+(m.level+1)**3+' · '+(m.level<100?Math.max(0,(m.level+1)**3-m.xp)+' to next level':'Maximum level')+'</p></div></div>';card.querySelector('.roster-top').prepend(Art.preview(m.id,m.mark));const details=document.createElement('details');details.innerHTML='<summary>Stats, moves & origin</summary><p>'+s.bio+'</p><div class="stats-grid">'+KEYS.map((k,j)=>'<div class="stat">'+LABELS[j]+'<br><b>'+st[k]+'</b></div>').join('')+'</div><p>'+s.ability+': '+ABILITIES[s.ability]+'<br>Origin: '+m.origin+'<br>IVs: '+m.ivs.join(' / ')+'<br>Training: '+m.evs.join(' / ')+' (budget 510)<br>Held: '+(m.heldItem?HELD_ITEMS[m.heldItem].name:'None')+'</p><div class="move-list">'+m.moves.map(v=>MOVES[v.id].name+' · '+MOVES[v.id].type+' · '+v.pp+'/'+MOVES[v.id].pp+' PP').join('<br>')+'</div>';card.append(lineageCard(m));card.append(details);const actions=document.createElement('div');actions.className='roster-actions';actions.append(button('Family card',()=>showFamily(m)),button('Held item',()=>equipItem(m)),button('Training & moves',()=>showTraining(m)));if(stored){actions.append(button('Add to team',()=>{state.party.push(state.storage.splice(i,1)[0]);save();update();showParty()},'',state.party.length>=6))}else{actions.append(button('Make lead',()=>{[state.party[0],state.party[i]]=[state.party[i],state.party[0]];save();update();showParty()},'',i===0||m.hp<=0));actions.append(button('Store',()=>{state.storage.push(state.party.splice(i,1)[0]);save();update();showParty()},'',state.party.length===1||!state.party.some((v,j)=>j!==i&&v.hp>0)))}actions.append(button('Release to Drift',()=>confirmRelease(m,i,stored),'',!stored&&(state.party.length===1||!state.party.some((v,j)=>j!==i&&v.hp>0))));card.append(actions);body.append(card)}
 function showGuide(){const b=openModal('Rivenmoor field guide','36 SPECIES · 18 EVOLUTION LINES');b.innerHTML='<p>These creatures, moves and matchups are original prototype data based on the design overview. Evolve base forms at level 9, 10 or 12.</p>';for(const [id,s]of Object.entries(SPECIES)){const card=document.createElement('div');card.className='roster';card.innerHTML='<div class="roster-top"><div class="detail"><b>'+s.name+'</b><p>'+s.types.join(' / ')+' · '+s.ability+'<br>'+s.bio+'</p><p>'+(s.evolve?'Evolves at level '+s.evolve.level+' → '+SPECIES[s.evolve.to].name:'Evolved form')+'</p></div></div>';card.querySelector('.roster-top').prepend(Art.preview(id));b.append(card)}}
 function showTypes(){const b=openModal('Type matchups','PROTOTYPE BALANCE');b.innerHTML='<p>Attacking type → defending type. Unlisted pairs are 1×. Dual types multiply, from 0× up to 4×. A same-type move gets a 1.5× damage bonus.</p>';for(const t of TYPES){const pairs=Object.entries(TYPE_CHART[t]);const r=document.createElement('div');r.className='type-row';r.innerHTML='<b>'+t+'</b><br>'+[2,.5,0].map(n=>{const targets=pairs.filter(([,v])=>v===n).map(([k])=>k);return targets.length?n+'×: '+targets.join(', '):''}).filter(Boolean).join('<br>');b.append(r)}b.insertAdjacentHTML('beforeend','<h3>Status conditions</h3>'+Object.entries(STATUS_INFO).map(([k,v])=>'<p><b>'+k+'</b>: '+v+'</p>').join(''))}
 function showMenu(){if(busy||battle)return;const b=openModal('Field kit','SLOT '+slot+' · '+state.money+' COINS');b.innerHTML='<p>'+state.party.length+' in team · '+state.storage.length+' in storage<br>'+state.balls.basic+' Field / '+state.balls.trail+' Trail / '+state.balls.great+' Reef / '+state.balls.ultra+' Aurora balls<br>'+state.potions+' field potions</p>';const g=document.createElement('div');g.className='menu-grid';g.append(button('World & sound',showWorldSettings),button('Team battle',showDoubleGuide),button('Journal',showProgress),button('Keeper missions',showExpeditions),button('Trail practice · coins',showTrailCircuit),button('Field shop',showShop),button('Community requests',showQuests),button('Nursery',showBreeding),button('Local Drift',showDrift),button('Save now',()=>{save();toast('Progress saved to slot '+slot+'.');closeModal()}),button('Save slots',showSlots),button('Field guide',showDex),button('Type chart',showTypes),button('Export save',exportSave),button('Import save',importSave));const select=document.createElement('select');select.setAttribute('aria-label','Difficulty');select.innerHTML='<option>Easy</option><option>Standard</option>';select.value=state.difficulty;select.onchange=()=>{state.difficulty=select.value;save()};b.append(g);b.insertAdjacentHTML('beforeend','<h3>Difficulty</h3>');b.append(select);b.insertAdjacentHTML('beforeend','<p class="note">Easy reduces incoming damage by 25% and adds 5 points to your move accuracy. Field supplies has free basic balls anywhere outside battle. Roadside stands sell better balls. Trainer wins and community requests earn game coins.</p><h3>The first valley leg</h3><p class="note">This is a first playable, not the full chapter. Twenty compact areas are playable; full chapter pacing and presentation are still in progress. Local lineage, breeding and Drift simulation are in. No networking, online co-op or 3D lighting. Team battles, day/night and weather are included. Saves stay in this browser and can be cleared by browser settings. Export a code for a backup.</p>')}
 function showSlots(){const b=openModal('Three journeys','LOCAL SAVE SLOTS');for(let n=1;n<=3;n++){let s;try{s=JSON.parse(localStorage.getItem('critter-capture-slot-'+n))}catch{}const r=document.createElement('div');r.className='slot';r.innerHTML='<div>Slot '+n+(n===slot?' · Current':'')+'<small>'+(validSave(s)?SPECIES[s.party[0].id].name+' L'+s.party[0].level+' · '+s.party.length+' companions':'Empty')+'</small></div>';r.append(button(validSave(s)?'Load':'Begin',()=>{if(validSave(s)){save();if(load(n))toast('Loaded slot '+n+'.')}else{save();slot=n;state=fresh();update();chooseStarter()}},'primary'));if(validSave(s))r.append(button('Reset',()=>confirmReset(n)));b.append(r)}b.insertAdjacentHTML('beforeend','<p class="note">Reset erases only the selected slot. Export first if you want a backup.</p>')}
 function confirmReset(n){const b=openModal('Reset slot '+n+'?','THIS CANNOT BE UNDONE');b.innerHTML='<p>The saved journey in slot '+n+' will be erased. Your other slots will stay.</p>';b.append(button('Cancel',showSlots),button('Erase slot '+n,()=>{try{localStorage.removeItem('critter-capture-slot-'+n)}catch{}if(n===slot){state=fresh();update();chooseStarter()}else showSlots()}))}
 function exportSave(){save();const b=openModal('Take your journey with you','SAVE BACKUP');b.innerHTML='<p>Copy this code somewhere safe. Use Import save in another browser to continue.</p>';const t=document.createElement('textarea');t.readOnly=true;t.value='CC1:'+btoa(unescape(encodeURIComponent(JSON.stringify(state))));b.append(t);b.append(button('Copy code',async()=>{try{await navigator.clipboard.writeText(t.value);toast('Save code copied.')}catch{t.focus();t.select();toast('Select the code and copy it.')}}));t.onclick=()=>t.select()}
 function importSave(){const b=openModal('Restore a journey','IMPORT INTO SLOT '+slot);b.innerHTML='<p>Paste a Critter Capture save code. This replaces the current slot after confirmation.</p>';const t=document.createElement('textarea');t.placeholder='CC1:…';t.setAttribute('aria-label','Save code');b.append(t);const status=document.createElement('p');status.setAttribute('role','status');b.append(status);b.append(button('Check save code',()=>{try{if(!t.value.trim().startsWith('CC1:'))throw Error();const s=JSON.parse(decodeURIComponent(escape(atob(t.value.trim().slice(4)))));if(!validSave(s))throw Error();const c=openModal('Replace slot '+slot+'?','RESTORE SAVE');c.innerHTML='<p>This backup has '+s.party.length+' companions, led by '+SPECIES[s.party[0].id].name+' at level '+s.party[0].level+'. Your current slot will be replaced.</p>';c.append(button('Cancel',showMenu),button('Restore backup',()=>{state=s;migrate();battle=null;busy=false;save();closeModal();update();toast('Journey restored.')}));}catch{status.textContent='This code is invalid or from an unsupported version.'}}))}
 // Input uses pointer capture so long presses and interrupted gestures release safely.
 document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();held=b.dataset.dir;b.setPointerCapture(e.pointerId);move(held);lastStep=performance.now()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held=null)});
 const dirs={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
 document.addEventListener('keydown',e=>{if(!$('#modal').hidden){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const focusable=[...$('#modal').querySelectorAll('button:not([hidden]),textarea,select,summary')].filter(x=>!x.disabled);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(dirs[e.key]&&!battle){e.preventDefault();if(!e.repeat){held=dirs[e.key];move(held);lastStep=performance.now()}}else if((e.code==='Space'||e.key==='Enter')&&e.target.tagName!=='BUTTON'){e.preventDefault();talk()}else if(e.key==='Escape'){if(battle&&!busy)rootActions();else closeModal()}});document.addEventListener('keyup',e=>{if(dirs[e.key])held=null});window.addEventListener('blur',()=>held=null);document.addEventListener('visibilitychange',()=>{held=null;if(document.hidden&&!battle)save()});window.addEventListener('pagehide',()=>{if(!battle)save()});
 $('#suppliesBtn').onclick=()=>{if(battle){toast('Supplies are available outside battle. Catch or leave first.');return}showShop()};$('#interactBtn').onclick=talk;$('#partyBtn').onclick=showParty;$('#menuBtn').onclick=()=>{if(battle)toast('Finish this battle before opening the field kit.');else showMenu()};$('#closeModal').onclick=closeModal;
 state=fresh();let n=1;try{n=Number(localStorage.getItem('critter-capture-active'))||1}catch{}if(!load(clamp(n,1,3))){update();chooseStarter()}requestAnimationFrame(frame);setInterval(()=>{if(state&&!document.hidden){state.seconds+=10;if(!battle)save()}},10000);

 if(new URLSearchParams(location.search).get('debug')==='1')window.CritterDebug={state:()=>state,battle:()=>battle,stats,createMon,awardXP,typeMultiplier,odds,startBattle,finishBattle,turn,move,heal,save,startDoubles,setParty:mons=>{state.party=mons;update()},setPosition:(area,x,y)=>{state.area=area;state.x=x;state.y=y;update()},setXP:(i,xp)=>state.party[i].xp=xp};
