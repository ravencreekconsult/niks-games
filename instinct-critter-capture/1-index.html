 async function awardXP(foe,caught=false){const indices=[...battle.participants],total=Math.floor(foe.level*32*(battle.trainer?1.4:1)*(caught?.65:1)),each=Math.max(1,Math.floor(total/indices.length));for(const i of indices){const m=state.party[i];if(!m||m.hp<=0)continue;m.xp+=each;const yieldStat=SPECIES[foe.id].trainingYield||{key:'atk',amount:1},yi=KEYS.indexOf(yieldStat.key),budget=510-m.evs.reduce((a,b)=>a+b,0);m.evs[yi]=Math.min(252,m.evs[yi]+Math.max(0,Math.min(yieldStat.amount,budget)));log(SPECIES[m.id].name+' gained '+each+' XP.');while(m.level<100&&m.xp>=(m.level+1)**3){const oldHP=stats(m).hp;m.level++;m.hp+=stats(m).hp-oldHP;log(SPECIES[m.id].name+' grew to level '+m.level+'!');await wait(550);for(const [lv,id]of SPECIES[m.id].moves){if(lv===m.level&&!m.moves.some(v=>v.id===id)){await learnLevelMove(m,id);await wait(400)}}const e=SPECIES[m.id].evolve;if(e&&m.level>=e.level){const name=SPECIES[m.id].name,old=stats(m).hp;m.id=e.to;m.hp+=stats(m).hp-old;state.seen=[...new Set([...state.seen,m.id])];state.caught=[...new Set([...state.caught,m.id])];log(name+' evolved into '+SPECIES[m.id].name+'!');await wait(900)}}}}

 function showQuest(id){const q=QUESTS[id],b=openModal(q.name,'COMMUNITY · '+q.reward+' COINS');b.innerHTML='<p>'+q.story+'</p><p>Request: '+q.types.join(' + ')+' type'+(q.types.length>1?'s on different companions':'')+'. Reward: '+q.reward+' coins and three Trail balls.</p>';if(state.questDone.includes(id)){b.insertAdjacentHTML('beforeend','<p>Thank you. Your companions are part of the valley community now. Reward already collected.</p>');for(const m of state.questDeliveries.find(d=>d.quest===id)?.companions||[])b.append(button(SPECIES[m.id].name+' · Family record',()=>showFamily(m)));return}if(!state.questAccepted.includes(id)){if(REGION[state.area].name!==q.area){b.insertAdjacentHTML('beforeend','<p>Visit '+q.area+' and talk to the person marked ? to accept.</p>');return}b.append(button('Accept request',()=>{state.questAccepted.push(id);save();showQuest(id)},'primary'));return}const selects=[];q.types.forEach(type=>{const l=document.createElement('label');l.textContent=type+' companion';b.append(l);const select=document.createElement('select');select.setAttribute('aria-label',type+' companion');select.append(new Option('Choose a companion',''));for(const m of state.party.concat(state.storage))if(SPECIES[m.id].types.includes(type))select.append(new Option(SPECIES[m.id].name+' · L'+m.level+' · G'+m.lineage.generation+' · '+(state.party.includes(m)?'Team':'Storage'),m.uid));b.append(select);selects.push(select)});const status=document.createElement('p');status.setAttribute('role','status');b.append(status);b.append(button('Review handover',()=>{const chosen=selects.map(el=>state.party.concat(state.storage).find(m=>m.uid===el.value));if(chosen.some(m=>!m)||new Set(chosen).size!==chosen.length){status.textContent='Choose one different matching companion for each type. Catch or retrieve one if needed.';return}if(!state.party.some(m=>m.hp>0&&!chosen.includes(m))){status.textContent='Keep at least one healthy companion in your team.';return}const c=openModal('Give these companions?','REVIEW HANDOVER');c.innerHTML='<p>'+chosen.map(m=>SPECIES[m.id].name+' · L'+m.level+' · G'+m.lineage.generation).join('<br>')+'</p><p>They leave your collection to join '+q.name+'. This cannot be undone. Their family records stay in your completed-request history. Receive '+q.reward+' coins and three Trail balls.</p>';c.append(button('Keep companions',()=>showQuest(id)),button('Confirm handover',()=>{if(state.questDone.includes(id))return;state.questDeliveries.push({quest:id,companions:JSON.parse(JSON.stringify(chosen))});state.party=state.party.filter(m=>!chosen.includes(m));state.storage=state.storage.filter(m=>!chosen.includes(m));state.questDone.push(id);state.money+=q.reward;state.balls.trail+=3;save();update();showQuest(id);toast('Request complete. '+q.reward+' coins and three Trail balls received.')},'primary'))},'primary'))}
 function showShop(){const body=openModal('The valley supply network',REGION[state.area].name.toUpperCase()+' · '+state.money+' COINS');body.innerHTML='<p>The lantern keepers fund a free Field ball kit so every traveller can help the valley. Better balls cost coins earned from trainers and community requests. Nothing here spends real money.</p><p>Field balls have weaker catch odds. After two failed Field ball throws, an awake wild critter has a 30% flee chance on each failed Field ball throw. Fainted critters never flee and stay easy to catch.</p>';const balance=document.createElement('p');balance.className='shop-balance';const status=document.createElement('p');status.className='shop-confirmation';status.setAttribute('role','status');status.setAttribute('aria-live','polite');status.textContent='Your supplies are ready.';body.append(balance,status);const free=button('',()=>{state.balls.basic=Math.max(10,state.balls.basic);save();refresh();status.textContent='Field kit refilled. You have '+state.balls.basic+' Field balls.'},'primary');body.append(free,button('Community requests',showQuests));const rows=[];function count(id,item){return item.kind==='ball'?state.balls[id]:item.kind==='potion'?state.potions:state.inventory[id]||0}for(const [id,item]of Object.entries(SHOP)){const row=document.createElement('div');row.className='shop-row';const text=document.createElement('div');const buy=button('Buy',()=>{if(state.money<item.price)return;state.money-=item.price;if(item.kind==='ball')state.balls[id]++;else if(item.kind==='potion')state.potions++;else state.inventory[id]=(state.inventory[id]||0)+1;save();refresh();status.textContent='Bought '+item.name+' · '+item.price+' coins. Now in your bag: '+count(id,item)+'.';row.classList.remove('purchase-flash');void row.offsetWidth;row.classList.add('purchase-flash');},'',state.money<item.price);row.append(text,buy);body.append(row);rows.push({id,item,text,buy})}function refresh(){balance.textContent=state.money+' coins available';free.textContent='Refill to 10 Field balls · Free · Have '+state.balls.basic;$('#modalKicker').textContent=REGION[state.area].name.toUpperCase()+' · '+state.money+' COINS';for(const {id,item,text,buy}of rows){text.innerHTML='<b>'+item.name+'</b><small>'+item.price+' coins · In bag: '+count(id,item)+(item.kind==='held'?' · Equipped: '+state.party.concat(state.storage).filter(m=>m.heldItem===id).length:'')+(item.description?'<br>'+item.description:'')+'</small>';buy.disabled=state.money<item.price}}refresh();}

 function showTraining(m){const body=openModal('Grow your companion','TRAINING · '+SPECIES[m.id].name);body.innerHTML='<p>Battle training has a 510-point total budget, with at most 252 in one stat. Spend 4 training points for roughly one extra stat point at level 100. These are in-game coins only. Moves here are already learned by this species at its current level, or inherited at birth.</p>';for(let i=0;i<6;i++){const r=document.createElement('div');r.className='shop-row';r.innerHTML='<b>'+LABELS[i]+' · '+m.evs[i]+'</b>';r.append(button('Train +4 · 20 coins',()=>{if(state.money<20)return;const amount=Math.min(4,252-m.evs[i],510-m.evs.reduce((a,b)=>a+b,0));if(amount<=0)return;const old=stats(m).hp;state.money-=20;m.evs[i]+=amount;m.hp=m.hp>0?Math.max(1,m.hp+stats(m).hp-old):0;save();update();showTraining(m)},'',state.money<20||m.evs[i]>=252||m.evs.reduce((a,b)=>a+b,0)>=510));body.append(r)}body.append(button('Reset all training · Free',()=>{const b=openModal('Reset training?','KEEP YOUR COMPANION');b.innerHTML='<p>Clear training points only. Level, individual values, moves and lineage stay intact. Coins spent on training are not refunded.</p>';b.append(button('Keep training',()=>showTraining(m)),button('Reset points',()=>{const old=stats(m).hp;m.evs=KEYS.map(()=>0);m.hp=m.hp>0?Math.max(1,Math.min(stats(m).hp,m.hp+stats(m).hp-old)):0;save();showTraining(m)}))},'back'));body.insertAdjacentHTML('beforeend','<h3>Recall a learned move</h3>');const available=[...new Set(SPECIES[m.id].moves.filter(([lv])=>lv<=m.level).map(([,id])=>id).concat(m.eggMoves||[]))];for(const id of available)if(!m.moves.some(v=>v.id===id))body.append(button(MOVES[id].name+' · Recall free',()=>replaceMove(m,id,()=>showTraining(m))));body.append(button('Back to team',showParty,'primary'));}
 function replaceMove(m,id,back){if(m.moves.length<4){m.moves.push({id,pp:MOVES[id].pp});save();back();return}const b=openModal('Make room for '+MOVES[id].name,'CHOOSE A MOVE TO REPLACE');b.innerHTML='<p>Your companion can carry four moves. Choose which move to forget. Its inherited-move record stays intact for later recall.</p>';m.moves.forEach((v,i)=>b.append(button('Replace '+MOVES[v.id].name,()=>{m.moves[i]={id,pp:MOVES[id].pp};save();back()})));b.append(button('Keep current moves',back,'back'));}

 function equipItem(m){const body=openModal('Held item · '+SPECIES[m.id].name,'FIELD EQUIPMENT');body.innerHTML='<p>One held item per companion. Unequipping returns it to your bag. Items are not consumed.</p>';if(m.heldItem){body.append(button('Remove '+HELD_ITEMS[m.heldItem].name,()=>{state.inventory[m.heldItem]=(state.inventory[m.heldItem]||0)+1;m.heldItem=null;save();equipItem(m)}))}for(const [id,item]of Object.entries(HELD_ITEMS))body.append(button(item.name+' · '+(state.inventory[id]||0)+'<small>'+item.description+'</small>',()=>{if(!state.inventory[id])return;if(m.heldItem)state.inventory[m.heldItem]=(state.inventory[m.heldItem]||0)+1;state.inventory[id]--;m.heldItem=id;save();equipItem(m)},'wide item-choice',!state.inventory[id]));body.append(button('Back to team',showParty,'primary'))}
 function expeditionReady(id){const all=state.party.concat(state.storage,state.drift);return {trail:state.trainerWins.includes('wren')&&state.caught.length>=3,family:state.trainerWins.includes('fern')&&all.some(m=>m.lineage.generation>=1),lantern:state.badges.length===4&&state.storyComplete,beacon:state.archiveRead&&state.valleyComplete&&state.trainerWins.includes('rowanFinal')}[id]}
 function showExpeditions(){const b=openModal("The keepers' expedition",'CONNECTED MISSIONS');b.innerHTML='<p>The four keepers are working toward one signal across the valley. Each step has a story, a goal and a once-only trail fund. Your earlier progress counts. These rewards do not replace badges or block the main route.</p>';for(let i=0;i<EXPEDITIONS.length;i++){const e=EXPEDITIONS[i],done=state.expeditionDone.includes(e.id),open=i===0||state.expeditionDone.includes(EXPEDITIONS[i-1].id),card=document.createElement('div');card.className='roster';card.innerHTML='<h3>'+String(i+1)+'. '+e.title+'</h3><p><b>'+e.speaker+'</b><br>'+e.story+'</p><p>'+e.goal+'</p><p>'+e.reward+' coins + 2 Reef balls · '+(done?'Trail fund collected':!open?'Finish the previous mission first':expeditionReady(e.id)?'Ready to report':'In progress')+'</p>';if(!done&&open)card.append(button('Report to the keepers',()=>{if(!expeditionReady(e.id)||state.expeditionDone.includes(e.id))return;state.expeditionDone.push(e.id);state.money+=e.reward;state.balls.great+=2;save();update();showExpeditions();playTone(660,.2)},'primary',!expeditionReady(e.id)));b.append(card)}b.append(button('Back to journal',showProgress,'back'))}
 function showTrailCircuit(){const b=openModal("A fair day's practice",'EARN GAME COINS');b.innerHTML='<p>The keepers pay 70 coins for a completed two-opponent trail test, as often as you want to practice. No entry cost and no real money. Loss gives no reward and sends your team home to heal, like other battles.</p><p>Opponents follow your healthy team\'s average level, from 5 to 25. This is a repeatable supply fund, not a badge challenge. Bring a healed team and stocked moves.</p><p>Practice wins: '+state.circuitWins+'</p>';b.append(button('Begin trail practice · Free',()=>{if(!state.party.some(m=>m.hp>0))return;const healthy=state.party.filter(m=>m.hp>0),lv=clamp(Math.round(healthy.reduce((a,m)=>a+m.level,0)/healthy.length),5,25);TRAINERS.trailCircuit.team=[['flitter',lv],['puddlep',lv]];closeModal();startBattle('trailCircuit')},'primary'))}
 function keeperNextStep(){const id=Object.keys(CHALLENGES).find(id=>!state.badges.includes(id)),c=CHALLENGES[id],chamber=Object.keys(CHAMBERS).find(a=>CHAMBERS[a].warden===id),name=CHAMBERS[chamber].name,place={brook:'northwest',granite:'northeast',aurora:'southwest',thorn:'southeast'}[id];if(CHAMBERS[state.area]&&state.area!==chamber)return 'Leave this chamber south to the hall. Talk to '+c.name+' in the '+place+' corner to enter '+name+'.';if(state.area===chamber)return state.chamberDevices.includes(chamber)?'Works prepared. Follow the walkway to the north platform and Talk to '+c.name+' for the '+c.badge+'.':'Follow the winding walkway to the mechanism on its west side. Talk / inspect it to prepare '+name+'; then continue to '+c.name+'.';if(state.area==='hall')return 'Talk to '+c.name+' in the '+place+' corner of this hall to enter '+name+'.';const route=state.area==='mine'?'Walk south out of Deep Echoquarry, then south through Echoquarry into Alderhaven.':state.area==='cave'?'Walk south out of Echoquarry into Alderhaven.':state.area==='town'?'In Alderhaven, find the hall keeper southwest of the center road and Talk to enter the hall.':state.area==='nursery'?'Leave the nursery south. Find the hall keeper southwest of the center road in Alderhaven.':state.area==='village'?'Head north through Reedway and Lanternwood to Alderhaven.':state.area==='route'?'Head north through Lanternwood to Alderhaven.':state.area==='forest'?'Head north into Alderhaven.':'Return to Alderhaven via the southern roads and Mirrorlake. Enter the hall with the keeper southwest of the center road.';return route+' Next: '+c.name+' in the '+place+' corner of the hall ('+name+').';}
 function nextMission(){if(!state.trainerWins.includes('wren'))return 'Meet Scout Wren on Reedway and earn the forest permit.';if(!state.trainerWins.includes('fern'))return "Follow Lanternwood north and earn Fern's Alderhaven permit.";if(state.party.filter(m=>m.hp>0).length<2)return 'Catch and heal a second companion for the coming team challenges.';if(state.badges.length<4)return keeperNextStep();if(!state.storyComplete)return 'Use Shove in Echoquarry and restore the deep-mine lantern.';if(!state.archiveRead)return 'Cross Mirrorlake to Willowharbor, follow the northern permits and read the ruins archive.';if(!state.trainerWins.includes('rowanFinal'))return 'Bring two healthy companions to Rowan at the quarry overlook.';if(!state.valleyComplete)return 'Carry the archive record to the beacon at the north overlook.';return 'Both lights are restored. Complete community requests and raise your next family.'}
 
 const TRAIL_NOTES={village:'North leads to Reedway. The west house marked REST heals for free. Ranger Moss is beside the main road; the east door leads to the lab.',route:'Stay on the center road for safe travel. Tall grass lies to either side. Wren waits halfway north. After that permit, the north road enters Lanternwood.',forest:'Fern waits on the center path. The nursery keeper near the south entrance explains families. After Fern, continue north to Alderhaven.',town:'The west door is the nursery; the east house marked REST heals for free. The hall keeper in the southwest opens the four chambers. The southeast keeper opens Mirrorlake. Rowan guards the north road to Echoquarry.',hall:'Speak to the gold-crowned wardens to enter their chambers. The order is Brook, Granite, Aurora, then Thorn. Each chamber has a mechanism beside its winding walkway.',lake:'The north crossing needs Swim, earned from Brook. Follow the center waterway north to Willowharbor. South returns to Alderhaven.',cave:'Flint waits on the main road. The fallen stone at the north exit needs Shove from Granite. Push one boulder north, then step into the other center lane to pass it. Continue north into the deep quarry.',mine:'Follow the road north to the quarry lantern. It answers only after all four badges. Return south to Alderhaven, then cross Mirrorlake for the northern half of the story.',harbor:'Heal at the east REST house. The west door opens the depot. The elder explains the archive. North leads to Amber orchard.',orchard:'Amber tests your team halfway north. Investigate the harvest baskets west of the path for a one-time trail fund. North leads to Reedglass marsh.',marsh:'Reed waits halfway north. Stay on the road if you do not want to cross the pools. The listening post lies southeast. North leads to the archive ruins.',ruins:'The archive is northwest of the road. Read its record. Ivy tests two companions on the center path; the next permit opens the overlook.',ridge:'Bring two healthy companions to Rowan. After the test, continue north, push the fallen stone with Shove, and inspect the beacon. It also needs the archive, quarry lantern and all four badges.',lab:'The lab guide explains the valley story. The south door returns to Bramblebay.',nursery:'The keeper is on the west side; Ranger Moss heals on the east. Parent A chooses the species line. Parent B must share the body family. Both parents stay at the nursery. Walk 60 steps, then collect the parents and baby here.',depot:'The west stand sells field supplies; the elder on the east explains the northern trail. The south door returns to Willowharbor.'};
 
 function showChamberTask(){const area=state.area,c=CHAMBERS[area];if(!c)return;const body=openModal(c.name+' mechanism','KEEPER TASK');if(state.chamberDevices.includes(area)){body.innerHTML='<p>'+c.story+'</p><p>You have prepared these works. Follow the walkway to the warden at the north platform.</p>';return}const id=c.warden;let phase=0;const tasks={brook:[{clue:'The intake feeds a filter, then the village pipe. A slate reads: "Water first enters here. Do not send unfiltered water to the houses." Which valve opens first?',options:[['Open the village outlet',false,'The outlet needs clean water first. Follow the intake arrow.'],['Open the upstream intake',true,'Water reaches the filter.']],next:'The filter is ready. Now choose where the cleaned water should go.'},{clue:'The clean channel divides between a village pipe and a waste drain.',options:[['Send it through the village pipe',true,'Clean water reaches the village.'],['Send it into the waste drain',false,'That drains the work away. The houses need the cleaned water.']]}],granite:[{clue:'A stone lift hangs above the walking path. The support is loose. A worker left a brace and a release lever. What makes the path safe?',options:[['Release the hanging stone',false,'The loose support would drop it into the path. Secure the lift first.'],['Fit the brace under the support',true,'The support holds firmly.']]},{clue:'The braced lift has a heavy east tray and an empty west tray. One counterweight is on the floor.',options:[['Place the counterweight on the west tray',true,'The lift balances and the walking path clears.'],['Add weight to the east tray',false,'The heavy tray would tip farther. Balance the empty side.']]}],aurora:[{clue:'The lantern beam hits a dull wall. A mirror faces the wall; a painted arrow points from the mirror to a crystal on the north platform.',options:[['Turn the mirror toward the north crystal',true,'The crystal catches a quiet glow.'],['Cover the mirror with its cloth',false,'Covering the mirror hides the light. Follow the painted arrow.']]},{clue:'The crystal is glowing, but its lens cover is dusty. A soft brush hangs nearby.',options:[['Brush the lens gently',true,'Light reaches the warden platform.'],['Strike the crystal to brighten it',false,'The crystal would crack. The dust, not the crystal, is blocking the beam.']]}],thorn:[{clue:'Seedlings beside the walkway lean toward a dry channel. The keeper left a watering can and pruning shears.',options:[['Water the dry roots',true,'The seedlings lift and the roots begin to loosen.'],['Cut the healthy seedlings',false,'They are thirsty, not in the way. Tend their roots first.']]},{clue:'A fallen branch lies across the path. It can become a shelter in the planted bed or be pushed into the water channel.',options:[['Move it into the planted bed',true,'Small companions gain a shelter and the path is clear.'],['Push it into the water channel',false,'That would block the water you just restored. Keep the channel open.']]}]};const list=tasks[id];function render(feedback=''){body.replaceChildren();body.insertAdjacentHTML('beforeend','<p>'+c.story+'</p><h3>Step '+(phase+1)+' of '+list.length+'</h3><p>'+list[phase].clue+'</p>');const status=document.createElement('p');status.setAttribute('role','status');status.textContent=feedback;body.append(status);for(const [label,correct,answer]of list[phase].options)body.append(button(label,()=>{if(!correct){status.textContent=answer;return}phase++;if(phase<list.length){playTone(660,.12);render(answer)}else{state.chamberDevices.push(area);save();playCue('badge');body.replaceChildren();body.insertAdjacentHTML('beforeend','<h3>The works are ready</h3><p>'+answer+'</p><p>Follow the walkway to '+TRAINERS[id].name+' on the north platform. Your preparation is saved.</p>');}},''));}render();}

 function showDirections(){const b=openModal('Find your next step','TRAIL DIRECTIONS');b.innerHTML='<h3>'+REGION[state.area].name+'</h3><p>'+(TRAIL_NOTES[state.area]||'Follow the winding walkway. Inspect the mechanism beside it before speaking to the warden on the north platform. Return south to the hall.')+'</p>'+(TRAIL_STORIES[state.area]?'<h3>People along the trail</h3><p>'+TRAIL_STORIES[state.area].speaker+' waits east of the road beside the open-book marker. '+(state.trailStories.includes(state.area)?'Their story is in your trail journal.':'Lend a hand in a short story between battles.')+'</p>':'')+'<h3>Main journey</h3><p>'+nextMission()+'</p><h3>A family along the way</h3><p>'+ (state.eggs.length?(state.eggs[0].remaining?'Your nursery family needs '+state.eggs[0].remaining+' more walking steps. Safe town paths count too. Return to the nursery when ready.':'Your family is ready. Return to the nursery interior through the west door in Alderhaven to collect them.'):state.party.concat(state.storage).some(m=>m.lineage.generation>=1)?'You have raised a first generation. The nursery remains open for the next branch.':state.trainerWins.includes('fern')?'Visit the Alderhaven nursery with two companions from the same body family. The child is optional for the main badges, but completes the family expedition for Fern.':'Catch companions while travelling. Fern opens the nursery road. You do not need a family before the first two trail tests.')+'</p><p class="note">Center paths avoid random grass encounters. REST houses and Ranger Moss heal for free. Fainted catches must be healed before they can battle.</p>';b.append(button('Keeper missions & rewards',showExpeditions));}

 function showProgress(){const body=openModal('The first valley chapter','JOURNAL');body.innerHTML='<h3>Next mission</h3><p>'+nextMission()+'</p><p>Three chapters are planned. This alpha covers twenty small areas and four challenge battles, still not a verified 10-12 hour Chapter One.</p>';body.append(button('Trail directions',showDirections),button('Trail story journal',showTrailJournal));body.append(button('Keeper expedition · story & rewards',showExpeditions,'primary'));for(const [id,c]of Object.entries(CHALLENGES)){const won=state.badges.includes(id);const row=document.createElement('div');row.className='type-row';row.innerHTML='<b>'+(won?'◆ ':'◇ ')+c.badge+'</b><br>'+c.name+' · '+(won?'Earned':Object.values(CHAMBERS).find(c=>c.warden===id).name+' · Enter from the Alderhaven hall')+(c.power?' · Unlocks '+c.power:'');body.append(row)}body.insertAdjacentHTML('beforeend','<h3>Field powers</h3><p>Swim: walk across water after the Current badge.<br>Shove: walk toward a boulder to push it if the tile beyond is clear.<br>Glow, Glide and Climb are planned for later chapters.</p><h3>Rivenmoor story</h3><p>'+(!state.badges.length?'Ranger Moss asks you to carry a record of the valley\'s creatures. Scout Wren is your first test.':state.badges.length<4?'The wardens trust you with new paths. A lantern has been fading beneath the quarry; keep training and bring your companions together.':'The four wardens have recognized your team. Search the deep quarry to restore its lantern and finish this alpha\'s small story.')+'</p>');body.insertAdjacentHTML('beforeend','<h3>Across Mirrorlake</h3><p>Willowharbor → Amber orchard → Reedglass marsh → Old lantern ruins → Quarry overlook. Read the ruins archive, defeat Rowan in a team battle, and restore the overlook beacon after the quarry lantern.</p>');if(state.valleyComplete)body.insertAdjacentHTML('beforeend','<p class="ending-note">Both valley lights are shining. Your expanded valley story is complete.</p>');if(state.storyComplete)body.insertAdjacentHTML('beforeend','<p class="ending-note">The quarry lantern shines again. Your family of companions made a difference. The rest of Rivenmoor is waiting for a later build.</p>')}
