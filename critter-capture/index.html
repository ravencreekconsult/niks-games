<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Critter Capture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #1a1c2c; touch-action: none;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  #wrap { height: 100%; display: flex; flex-direction: column; }
  #errbar { display: none; background: #b13e53; color: #f4f4f4; font: 12px monospace;
    padding: 6px 8px; white-space: pre-wrap; z-index: 30; }
  #stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0; }
  canvas#game { image-rendering: pixelated; image-rendering: crisp-edges;
    background: #1a1c2c; touch-action: none; }
  #hud { position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    color: #94b0c2; font: 10px monospace; background: rgba(26,28,44,0.7);
    padding: 2px 6px; border-radius: 4px; pointer-events: none; z-index: 10; }
  /* The menu is anchored to the bottom, so a tall menu (the critter detail card)
     would run off the TOP of the play area and become untappable. Cap it and let
     it scroll instead. */
  #menu { position: absolute; right: 8px; bottom: 8px; display: none;
    flex-direction: column; gap: 6px; z-index: 15;
    max-height: calc(100% - 12px); overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch; padding-right: 2px; }
  .mbtn { flex: 0 0 auto; min-width: 120px; min-height: 44px; padding: 8px 14px; font: bold 14px monospace;
    color: #f4f4f4; background: #29366f; border: 2px solid #73eff7; border-radius: 6px; }
  .mbtn.sel { background: #3b5dc9; outline: 2px solid #ffcd75; }
  .mbtn:disabled { opacity: 0.45; }
  #partyBtn { position: absolute; left: 8px; bottom: 8px; display: none;
    align-items: center; justify-content: center; min-width: 96px; min-height: 48px;
    padding: 10px 16px; font: bold 15px monospace; color: #f4f4f4;
    background: #29366f; border: 2px solid #73eff7; border-radius: 8px;
    z-index: 15; touch-action: none; user-select: none; }
  #partyBtn.pressed { background: #3b5dc9; }
  #controls { flex: 0 0 auto; display: flex; justify-content: space-between;
    align-items: center; padding: 10px 14px calc(16px + env(safe-area-inset-bottom));
    background: none; pointer-events: none; }
  #dpad { --pad: clamp(150px, 42vmin, 230px); position: relative;
    width: var(--pad); height: var(--pad); border-radius: 50%;
    background: rgba(26,28,44,0.35); border: 2px solid rgba(244,244,244,0.45);
    box-shadow: 0 0 10px rgba(0,0,0,0.55); opacity: 0.55;
    touch-action: none; pointer-events: auto; user-select: none;
    transition: opacity 0.08s; }
  #dpad.pressed { opacity: 1; }
  .dbtn { position: absolute; width: 33.4%; height: 33.4%;
    background: rgba(244,244,244,0.22); border: 2px solid rgba(244,244,244,0.55);
    border-radius: 10px; color: #f4f4f4; font: bold 18px monospace;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; }
  #dUp { left: 33.3%; top: 0; } #dDown { left: 33.3%; top: 66.6%; }
  #dLeft { left: 0; top: 33.3%; } #dRight { left: 66.6%; top: 33.3%; }
  #abBtns { display: flex; gap: 14px; align-items: flex-end; pointer-events: auto; }
  #btnB, #btnA { width: clamp(56px, 16vmin, 84px); height: clamp(56px, 16vmin, 84px);
    border-radius: 50%; font: bold 20px monospace; color: #1a1c2c;
    border: 3px solid rgba(26,28,44,0.6); touch-action: none; opacity: 0.55;
    box-shadow: 0 0 10px rgba(0,0,0,0.55); user-select: none;
    transition: opacity 0.08s; }
  #btnB { background: #ef7d57; margin-bottom: 18px; }
  #btnA { background: #a7f070; }
  .pressed { opacity: 1 !important; filter: brightness(1.2); }
</style>
</head>
<body>
  <div id="wrap">
    <div id="errbar"></div>
    <div id="stage">
      <canvas id="game" width="240" height="160"></canvas>
      <div id="hud">starting...</div>
      <div id="menu"></div>
      <div id="partyBtn">PARTY</div>
    </div>
    <div id="controls">
      <div id="dpad">
        <div class="dbtn" id="dUp">&#9650;</div>
        <div class="dbtn" id="dLeft">&#9664;</div>
        <div class="dbtn" id="dRight">&#9654;</div>
        <div class="dbtn" id="dDown">&#9660;</div>
      </div>
      <div id="abBtns">
        <div id="btnB">B</div>
        <div id="btnA">A</div>
      </div>
    </div>
  </div>
  <p style="display:none"><a href="rules/selftest.html">battle-rules self-test</a></p>
  <script>
    /* Watchdog: if the game module never boots, say so on screen. */
    setTimeout(function () {
      if (!window.__CC_OK) {
        var eb = document.getElementById('errbar');
        eb.style.display = 'block';
        eb.textContent = 'ERROR: the game did not finish starting. ' +
          'A script file may have failed to load. Check the address and reload.';
      }
    }, 4000);
  </script>
  <script type="module" src="js/core.js"></script>
</body>
</html>
