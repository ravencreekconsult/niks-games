<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critter Capture — map validation</title>
<style>
  body { background:#111; color:#ddd; font-family: system-ui, sans-serif; margin:0; padding:12px; font-size:15px; line-height:1.5; }
  h1 { font-size:1.2em; }
  h2 { font-size:1.05em; margin-top:1.4em; }
  table { border-collapse:collapse; margin:6px 0; font-size:14px; }
  td, th { border:1px solid #444; padding:2px 8px; text-align:left; }
  .ok { color:#6f6; }
  .bad { color:#f66; font-weight:bold; }
  #banner { padding:10px; border:1px solid #555; font-weight:bold; margin-bottom:8px; }
  .pass { background:#143; }
  .fail { background:#411; }
  pre { white-space:pre-wrap; color:#f66; }
</style>
</head>
<body>
<h1>Critter Capture — map validation</h1>
<div id="banner">checking…</div>
<div id="output">loading maps…</div>
<script type="module">
  window.onerror = function (msg, src, line, col) {
    const el = document.getElementById('output');
    const p = document.createElement('pre');
    p.textContent = 'PAGE ERROR: ' + msg + (line ? (' (line ' + line + ')') : '');
    el.appendChild(p);
    const b = document.getElementById('banner');
    b.textContent = 'VALIDATOR FAILED TO RUN';
    b.className = 'fail';
  };
  window.addEventListener('unhandledrejection', function (e) {
    const el = document.getElementById('output');
    const p = document.createElement('pre');
    p.textContent = 'PAGE ERROR (promise): ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
    el.appendChild(p);
  });

  import('./js/data/areas.js').then(run).catch(err => {
    const el = document.getElementById('output');
    const p = document.createElement('pre');
    p.textContent = 'LOAD ERROR: ' + (err && err.message ? err.message : String(err));
    el.appendChild(p);
    const b = document.getElementById('banner');
    b.textContent = 'VALIDATOR FAILED TO LOAD MAPS';
    b.className = 'fail';
  });

  function run(areas) {
    const MAPS = areas.MAPS;
    const parseMap = areas.parseMap;
    const ids = Object.keys(MAPS);
    let failures = 0;
    const out = document.getElementById('output');
    out.textContent = '';
    const results = [];

    for (const id of ids) {
      const map = MAPS[id];
      const sec = document.createElement('div');
      const h = document.createElement('h2');
      h.textContent = map.id + ' (' + map.name + ') — declared ' + map.w + ' wide x ' + map.h + ' tall';
      sec.appendChild(h);

      // Row length check
      const tbl = document.createElement('table');
      let rowProblems = 0;
      const head = document.createElement('tr');
      head.innerHTML = '<th>row</th><th>length</th><th>matches w?</th>';
      tbl.appendChild(head);
      for (let y = 0; y < map.h; y++) {
        const row = map.rows[y];
        const len = row ? row.length : 0;
        const ok = !!row && len === map.w;
        if (!ok) rowProblems++;
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + y + '</td><td>' + (row ? len : 'missing') + '</td><td class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'OK' : 'MISMATCH (expected ' + map.w + ')') + '</td>';
        tbl.appendChild(tr);
      }
      if (map.rows.length !== map.h) {
        rowProblems++;
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="3" class="bad">rows array has ' + map.rows.length + ' rows, expected ' + map.h + '</td>';
        tbl.appendChild(tr);
      }
      sec.appendChild(tbl);

      // Real parseMap check
      const parseP = document.createElement('p');
      try {
        parseMap(map);
        parseP.innerHTML = '<span class="ok">PASS — parseMap(map) succeeded</span>';
      } catch (err) {
        rowProblems++;
        parseP.innerHTML = '<span class="bad">FAIL — parseMap:</span>';
        const pre = document.createElement('pre');
        pre.textContent = err && err.message ? err.message : String(err);
        parseP.appendChild(pre);
      }
      sec.appendChild(parseP);
      if (rowProblems > 0) failures++;
      results.push({ id: map.id, sec, rowProblems });
    }

    // Warp sanity (shared across maps)
    const warpProblems = [];
    for (const id of ids) {
      const map = MAPS[id];
      const warps = map.warps || [];
      if (!Array.isArray(warps)) { warpProblems.push(map.id + ': warps is not an array'); continue; }
      for (let i = 0; i < warps.length; i++) {
        const wp = warps[i];
        if (typeof wp.x !== 'number' || typeof wp.y !== 'number' || wp.x < 0 || wp.y < 0 || wp.x >= map.w || wp.y >= map.h) {
          warpProblems.push(map.id + ' warp #' + i + ' at ' + wp.x + ',' + wp.y + ' is outside the map (' + map.w + 'x' + map.h + ')');
        }
        if (!MAPS[wp.to]) {
          warpProblems.push(map.id + ' warp #' + i + ' targets unknown map "' + wp.to + '"');
        }
      }
    }

    const wEl = document.createElement('div');
    if (warpProblems.length === 0) {
      wEl.innerHTML = '<h2>Warp sanity</h2><p class="ok">All warps in bounds, all targets exist.</p>';
    } else {
      wEl.innerHTML = '<h2>Warp sanity</h2><pre>' + warpProblems.join('\n') + '</pre>';
    }
    out.appendChild(wEl);

    for (const r of results) out.appendChild(r.sec);

    const b = document.getElementById('banner');
    if (failures === 0 && warpProblems.length === 0) {
      b.textContent = 'ALL MAPS VALID (' + ids.length + '/' + ids.length + ')';
      b.className = 'pass';
    } else {
      b.textContent = ids.length + ' MAPS CHECKED — ' + failures + ' FAILED' + (warpProblems.length ? ' (+' + warpProblems.length + ' warp problems)' : '');
      b.className = 'fail';
    }
  }
</script>
</body>
</html>
