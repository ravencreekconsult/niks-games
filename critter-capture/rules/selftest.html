<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critter Capture — Rules Self-Test</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1b1f2a; color:#e8e8f0; margin:0; padding:12px; font-size:15px; }
  h1 { font-size:20px; } h2 { font-size:17px; margin-top:24px; }
  #import-status { padding:8px; border-radius:6px; background:#333; font-weight:bold; }
  #import-status.ok { background:#1d5c2e; color:#b8f0c6; }
  #import-status.bad { background:#7a1f1f; color:#ffd6d6; }
  .banner { padding:8px; border-radius:6px; font-weight:bold; margin:8px 0; }
  .pass { background:#1d5c2e; color:#b8f0c6; }
  .fail { background:#7a1f1f; color:#ffd6d6; }
  pre { background:#11141c; padding:8px; border-radius:6px; overflow-x:auto; white-space:pre-wrap; font-size:12px; line-height:1.5; }
  .meta { color:#9aa4c0; font-size:13px; }
</style>
</head>
<body>
<h1>Critter Capture — Rules Self-Test</h1>
<div id="import-status">Importing battle-rules.js ...</div>
<div id="out"></div>

<script>
window.onerror = function (m, src, l, c) {
  var el = document.getElementById('import-status');
  el.textContent = 'PAGE ERROR: ' + m + ' (line ' + l + ')';
  el.className = 'bad';
};
</script>

<script type="module">
const statusEl = document.getElementById('import-status');
const out = document.getElementById('out');
let R = null;
try {
  R = await import('./battle-rules.js');
  statusEl.textContent = 'Module imported OK — running scenarios...';
  statusEl.className = 'ok';
} catch (e) {
  statusEl.textContent = 'IMPORT ERROR: ' + (e && e.message ? e.message : String(e));
  statusEl.className = 'bad';
}
if (R) runAll();

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function fmtEvent(e, names) {
  const n = id => (id !== undefined && id !== null && names[id]) ? names[id] : String(id);
  switch (e.t) {
    case 'move':    return '[move]    ' + n(e.actorId) + ' used ' + (R.MOVES[e.moveId] ? R.MOVES[e.moveId].name : e.moveId) + ' -> ' + n(e.targetId);
    case 'miss':    return '[miss]    ' + n(e.actorId) + ' missed ' + n(e.targetId);
    case 'damage':  return '[damage]  ' + n(e.targetId) + ' -' + e.amount + ' (hp ' + e.hpAfter + (e.crit ? ', CRIT' : '') + (e.effectiveness !== 1 ? ', x' + e.effectiveness : '') + ')';
    case 'heal':    return '[heal]    ' + n(e.targetId) + ' +' + e.amount + ' (hp ' + e.hpAfter + ')';
    case 'status':  return '[status]  ' + n(e.targetId) + ' -> ' + e.status;
    case 'statusEnd': return '[clear]   ' + n(e.targetId) + ' no longer ' + e.status;
    case 'stage':   return '[stage]   ' + n(e.targetId) + ' ' + e.stat + ' ' + (e.delta > 0 ? '+' : '') + e.delta;
    case 'weather': return '[weather] ' + (e.weather || 'cleared') + (e.turnsLeft !== undefined ? ' (' + e.turnsLeft + ' turns)' : '');
    case 'switch':  return '[switch]  out ' + n(e.outId) + ', in ' + n(e.inId);
    case 'faint':   return '[faint]   ' + n(e.targetId);
    case 'catch':   return '[catch]   ' + n(e.targetId) + (e.success ? ' CAUGHT after ' + e.shakes + ' shakes' : ' escaped after ' + e.shakes + ' shakes');
    case 'run':     return '[run]     pid ' + e.pid + (e.success ? ' escaped' : ' failed');
    case 'message': return '          ' + e.text;
    case 'end':     return '[end]     winner side ' + e.winnerSide;
    default:        return '[' + e.t + '] ' + JSON.stringify(e);
  }
}

function runScenario(title, buildState, opts) {
  const box = document.createElement('div');
  let html = '<h2>' + esc(title) + '</h2>';
  const fails = [];
  let state = buildState();
  const names = {};
  for (const c of state.combatants) names[c.id] = c.name;
  html += '<div class="meta">seed: ' + opts.seed + ' · max turns: ' + opts.maxTurns + '</div>';
  let turns = 0, done = false, winnerSide = null, lastResult = null;
  for (let t = 1; t <= opts.maxTurns && !done; t++) {
    // defaultIntent sanity check for EVERY combatant, every turn
    for (const c of state.combatants) {
      const di = R.defaultIntent({ state, pid: c.pid });
      if (!di || typeof di !== 'object' || typeof di.kind !== 'string') fails.push('turn ' + t + ': defaultIntent unusable for pid ' + c.pid);
    }
    let res;
    try { res = R.resolveTurn({ state, intents: (opts.intents ? opts.intents(t, state) : []), seed: opts.seed }); }
    catch (err) { fails.push('turn ' + t + ': resolveTurn threw: ' + err.message); break; }
    lastResult = res; state = res.state; done = res.done; winnerSide = res.winnerSide; turns = t;
    html += '<div class="meta">— turn ' + t + ' —</div><pre>';
    for (const e of res.events) html += esc(fmtEvent(e, names)) + '\n';
    html += '</pre>';
    // event sanity: damage events must carry hpAfter within bounds
    for (const e of res.events) {
      if (e.t === 'damage' && typeof e.hpAfter !== 'number') fails.push('turn ' + t + ': damage event without hpAfter');
      if (e.t === 'damage' && (e.hpAfter < 0 || e.hpAfter > 9999)) fails.push('turn ' + t + ': hpAfter out of range');
    }
  }
  html += '<div class="meta">Ran ' + turns + ' turn(s). Final HP:';
  for (const c of state.combatants) html += ' ' + esc(c.name) + '=' + c.hp + '/' + c.maxHp + (c.fainted ? ' (fainted)' : '');
  html += '</div>';
  html += '<div class="meta">Battle ended: ' + (done ? 'yes, winner side ' + winnerSide : 'no (still running after max turns)') + '</div>';
  if (opts.expectDone && !done) fails.push('expected the battle to end');
  if (opts.check) { const r = opts.check({ state, lastResult, winnerSide, events: lastResult ? lastResult.events : [] }); if (r) fails.push(r); }
  html += '<div class="banner ' + (fails.length ? 'fail' : 'pass') + '">' + (fails.length ? 'FAIL — ' + esc(fails.join(' | ')) : 'PASS') + '</div>';
  box.innerHTML = html;
  out.appendChild(box);
}

function runAll() {
  runScenario(
    'Scenario 1 — Auto-battle duel: Cinderpup vs Sproutle (default intents only)',
    () => R.createBattle({ seed: 1337, teams: [ [{ speciesId:'cinderpup', level:12, pid:0 }], [{ speciesId:'sproutle', level:12, pid:1 }] ] }),
    { seed: 1337, maxTurns: 40, expectDone: true }
  );

  runScenario(
    'Scenario 2 — Speed order check: Zephyrik (fast) vs Cragmite (slow)',
    () => R.createBattle({ seed: 4242, teams: [ [{ speciesId:'zephyrik', level:10, pid:0 }], [{ speciesId:'cragmite', level:10, pid:1 }] ] }),
    {
      seed: 4242, maxTurns: 1, expectDone: false,
      check: ({ state, events }) => {
        const firstMove = events.find(e => e.t === 'move');
        if (!firstMove) return 'no move event in first turn';
        const fast = state.combatants.find(c => c.speciesId === 'zephyrik');
        if (firstMove.actorId !== fast.id) return 'faster critter did not act first';
        return null;
      }
    }
  );

  runScenario(
    'Scenario 3 — Out of PP: default intent must fall back to Struggle',
    () => {
      const st = R.createBattle({ seed: 777, teams: [ [{ speciesId:'cinderpup', level:10, pid:0 }], [{ speciesId:'gloamkitty', level:10, pid:1 }] ] });
      st.combatants[0].moves.forEach(m => { m.pp = 0; });
      return st;
    },
    {
      seed: 777, maxTurns: 3, expectDone: false,
      check: ({ state, events }) => {
        const di = R.defaultIntent({ state, pid: 0 });
        if (!di || di.moveId !== R.STRUGGLE_ID) return 'defaultIntent did not return Struggle';
        if (!events.some(e => e.t === 'move' && e.moveId === R.STRUGGLE_ID)) return 'no Struggle move event seen';
        return null;
      }
    }
  );

  runScenario(
    'Scenario 4 — Capture attempt: low-HP foe, catch intent each turn',
    () => {
      const st = R.createBattle({ seed: 909, teams: [ [{ speciesId:'cinderpup', level:15, pid:0 }], [{ speciesId:'sproutle', level:3, pid:1 }] ] });
      st.combatants[1].hp = 1; // weaken the target
      return st;
    },
    {
      seed: 909, maxTurns: 10, expectDone: true,
      intents: (t, state) => {
        const foe = state.combatants.find(c => c.side === 1 && !c.fainted);
        const me = state.combatants.find(c => c.side === 0 && !c.fainted);
        if (!foe || !me) return [];
        return [{ pid: 0, actorId: me.id, kind: 'catch', targetId: foe.id }];
      },
      check: ({ events }) => {
        if (!events.some(e => e.t === 'catch')) return 'no catch event seen';
        return null;
      }
    }
  );
}
</script>
</body>
</html>
