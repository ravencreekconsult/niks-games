<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cookie Clicker</title>
<style>
  :root{
    --bg:#120d08; --panel:#1e1710; --panel2:#241c13; --line:#3a2c1c;
    --cookie:#d9a45b; --cookie-dk:#b7813c; --chip:#5a3216;
    --good:#ffd166; --gold:#ffc94d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(900px 500px at 50% -10%,#3a2a18,var(--bg)) fixed;
    color:#f6ead9;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;
  }
  header{padding:10px 14px 6px;text-align:center;flex:0 0 auto}
  #count{font-size:clamp(30px,9vw,46px);font-weight:800;letter-spacing:.5px;line-height:1.05}
  #cps{color:#c9b494;font-size:14px;margin-top:2px}
  #cps b{color:var(--good)}
  /* --- cookie stage --- */
  #stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;position:relative;min-height:150px}
  #cookie{
    width:min(48vh,58vw,230px);aspect-ratio:1/1;border-radius:50%;position:relative;
    background:radial-gradient(circle at 34% 28%,#e8bd7c,var(--cookie) 55%,var(--cookie-dk) 100%);
    box-shadow:0 14px 30px rgba(0,0,0,.5), inset 0 -8px 18px rgba(120,70,20,.45), inset 0 8px 14px rgba(255,225,180,.35);
    cursor:pointer;transition:transform .07s ease-out;touch-action:none;
  }
  #cookie.pop{transform:scale(.91)}
  .chip{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a4620,var(--chip));
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.35)}
  #float{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .plus{position:absolute;font-weight:800;color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.6);
    animation:rise .8s ease-out forwards;pointer-events:none;font-size:clamp(16px,4.5vw,22px)}
  @keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-70px) scale(1.25)}}
  /* --- shop --- */
  #shopwrap{flex:0 0 auto;max-height:52vh;overflow-y:auto;padding:6px 10px 14px;
    background:linear-gradient(180deg,rgba(0,0,0,0),var(--panel) 22px);-webkit-overflow-scrolling:touch}
  #shop{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;min-height:56px;text-align:left;color:inherit;font:inherit;width:100%;
    cursor:pointer;transition:.12s}
  .row:active{transform:scale(.985)}
  .row.locked{opacity:.5;cursor:not-allowed}
  .row.afford{border-color:var(--good);box-shadow:0 0 0 1px rgba(255,209,102,.25)}
  .ico{font-size:26px;width:34px;text-align:center;flex:0 0 auto}
  .info{flex:1 1 auto;min-width:0}
  .info b{display:block;font-size:16px}
  .info s{display:block;text-decoration:none;color:#c0ab8c;font-size:12.5px;margin-top:1px}
  .buy{flex:0 0 auto;text-align:right;font-weight:800;font-size:14px;color:#efdcbf}
  .buy i{display:block;font-style:normal;font-weight:600;color:#a8906f;font-size:11.5px;margin-top:2px}
  .own{color:var(--gold);font-size:12px;font-weight:700}
  footer{flex:0 0 auto;display:flex;gap:8px;align-items:center;justify-content:center;
    padding:8px 12px 12px;color:#8d7a60;font-size:12px}
  button.mini{background:#241c13;color:#d9c7a8;border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font:inherit;font-size:12px;min-height:44px}
  #note{color:#ffd166}
</style>
</head>
<body>
<header>
  <div id="count">0</div>
  <div id="cps">cookies per second: <b>0</b> &nbsp;·&nbsp; per tap: <b id="perTap">1</b></div>
</header>

<div id="stage">
  <div id="cookie" role="button" aria-label="Tap the cookie">
    <div id="float"></div>
  </div>
</div>

<div id="shopwrap"><div id="shop"></div></div>

<footer>
  <span id="note"></span>
  <button class="mini" id="reset">Start over</button>
</footer>

<script>
/* ---------- numbers ---------- */
const UNITS = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
function fmt(n){
  if(n < 1000) return Math.floor(n).toString();
  let i = 0;
  while(n >= 1000 && i < UNITS.length-1){ n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + UNITS[i];
}

/* ---------- state ---------- */
const SAVE_KEY = "nk-cookie-clicker-v1";
let S = { cookies:0, total:0, clicks:0, buildings:{}, tapUpgrades:0, last:Date.now() };

/* ---------- buildings (cookie-per-second makers) ---------- */
const BUILDINGS = [
  {id:"cursor", name:"Cursor",      ico:"👆", base:15,      cps:0.1,   blurb:"A finger that clicks on its own"},
  {id:"grandma",name:"Grandma",     ico:"👵", base:100,     cps:1,     blurb:"Bakes cookies by hand"},
  {id:"farm",   name:"Cookie Farm", ico:"🌾", base:1100,    cps:8,     blurb:"Grows cookies from the ground"},
  {id:"mine",   name:"Cookie Mine", ico:"⛏️", base:12000,   cps:47,    blurb:"Digs up cookie ore"},
  {id:"factory",name:"Factory",     ico:"🏭", base:130000,  cps:260,   blurb:"Makes them on a conveyor belt"},
  {id:"bank",   name:"Cookie Bank", ico:"🏦", base:1400000, cps:1400,  blurb:"Your cookies earn interest"},
  {id:"temple", name:"Temple",      ico:"🛕", base:2e7,     cps:7800,  blurb:"Ancient cookie worshippers"},
  {id:"portal", name:"Portal",      ico:"🌀", base:3.3e8,   cps:44000, blurb:"Cookies from another dimension"}
];
const TAP_COST = () => Math.floor(50 * Math.pow(2, S.tapUpgrades));
const TAP_GAIN = () => 1 + S.tapUpgrades;

function cost(b){ return Math.floor(b.base * Math.pow(1.15, S.buildings[b.id]||0)); }
function cps(){
  let t = 0;
  for(const b of BUILDINGS) t += (S.buildings[b.id]||0) * b.cps;
  return t;
}

/* ---------- sound (starts on his first tap) ---------- */
let AC = null;
function blip(freq){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime;
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.start(t); o.stop(t + 0.09);
  }catch(e){}
}

/* ---------- the cookie ---------- */
const cookieEl = document.getElementById("cookie");
const floatEl  = document.getElementById("float");
const countEl  = document.getElementById("count");
const cpsEl    = document.getElementById("cps");
const noteEl   = document.getElementById("note");
const shop     = document.getElementById("shop");

for(const [x,y,sz] of [[30,26,20],[62,20,13],[20,58,16],[52,50,22],[76,62,15],[40,76,18],[66,80,12]]){
  const d = document.createElement("div");
  d.className = "chip";
  d.style.left = x+"%"; d.style.top = y+"%";
  d.style.width = d.style.height = sz+"%";
  cookieEl.appendChild(d);
}

function addCookies(n, isClick){
  S.cookies += n; S.total += n;
  if(isClick) S.clicks++;
}

function gain(){
  const g = TAP_GAIN();
  addCookies(g, true);
  blip(520 + Math.random()*90);
  cookieEl.classList.add("pop");
  setTimeout(()=>cookieEl.classList.remove("pop"), 75);
  const p = document.createElement("div");
  p.className = "plus"; p.textContent = "+"+g;
  p.style.left = (50 + (Math.random()*40-20)) + "%";
  p.style.top  = "34%";
  floatEl.appendChild(p);
  setTimeout(()=>p.remove(), 820);
  render();
}
cookieEl.addEventListener("pointerdown", e=>{ e.preventDefault(); gain(); });
cookieEl.addEventListener("contextmenu", e=>e.preventDefault());

/* ---------- shop (rows are built ONCE, then only their text is refreshed) ---------- */
const shopRows = [];

function addRow(spec){
  const btn = document.createElement("button");
  btn.className = "row";
  const ico = document.createElement("span"); ico.className = "ico"; ico.textContent = spec.ico;
  const info = document.createElement("span"); info.className = "info";
  const nm = document.createElement("b"); nm.textContent = spec.name + " ";
  const ownEl = document.createElement("span"); ownEl.className = "own";
  nm.appendChild(ownEl);
  const bl = document.createElement("s"); bl.textContent = spec.blurb;
  info.appendChild(nm); info.appendChild(bl);
  const buyEl = document.createElement("span"); buyEl.className = "buy";
  const priceEl = document.createElement("span");
  const subEl = document.createElement("i");
  buyEl.appendChild(priceEl); buyEl.appendChild(subEl);
  btn.appendChild(ico); btn.appendChild(info); btn.appendChild(buyEl);
  btn.addEventListener("click", ()=>{
    if(btn.classList.contains("locked")) return;
    spec.buy();
    blip(300);
    render(true);
  });
  spec.el = btn; spec.priceEl = priceEl; spec.subEl = subEl; spec.ownEl = ownEl;
  shop.appendChild(btn);
  shopRows.push(spec);
}

function buildShop(){
  shop.innerHTML = "";
  shopRows.length = 0;

  addRow({
    ico:"💪", name:"Stronger Tap", blurb:"Each tap does one more cookie",
    buy(){ const p = TAP_COST(); if(S.cookies < p) return; S.cookies -= p; S.tapUpgrades++; },
    state(){
      return { show:true, price:TAP_COST(), sub:"next tap: "+(TAP_GAIN()+1)+" per tap",
               owned:S.tapUpgrades ? "lv "+S.tapUpgrades : "", can:S.cookies >= TAP_COST() };
    }
  });

  for(const b of BUILDINGS){
    addRow({
      ico:b.ico, name:b.name, blurb:b.blurb,
      buy(){ const p = cost(b); if(S.cookies < p) return; S.cookies -= p; S.buildings[b.id] = (S.buildings[b.id]||0) + 1; },
      state(){
        const owned = S.buildings[b.id]||0, p = cost(b);
        return { show: owned > 0 || S.total >= b.base * 0.35,
                 price:p, sub:"+"+fmt(b.cps)+" cps each",
                 owned: owned ? "x"+owned : "", can: S.cookies >= p };
      }
    });
  }
}

function updateShop(){
  for(const r of shopRows){
    const st = r.state();
    r.el.style.display = st.show ? "" : "none";
    if(!st.show) continue;
    r.priceEl.textContent = fmt(st.price);
    r.subEl.textContent = st.sub;
    r.ownEl.textContent = st.owned;
    r.el.classList.toggle("afford", st.can);
    r.el.classList.toggle("locked", !st.can);
  }
}

/* ---------- render ---------- */
let lastUI = 0;
function render(force){
  countEl.textContent = fmt(S.cookies);
  const now = performance.now();
  if(force || now - lastUI > 120){
    lastUI = now;
    const c = cps();
    cpsEl.innerHTML = "cookies per second: <b>"+fmt(c)+"</b> &nbsp;·&nbsp; per tap: <b>"+TAP_GAIN()+"</b>";
    updateShop();
  }
}

/* ---------- save / offline / loop ---------- */
function save(){ S.last = Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    S = Object.assign(S, d);
    S.buildings = d.buildings || {};
    const away = Math.min((Date.now() - (d.last||Date.now()))/1000, 7200);
    const gained = cps() * away * 0.5;
    if(gained > 1){
      S.cookies += gained; S.total += gained;
      noteEl.textContent = "welcome back: +"+fmt(gained)+" cookies";
    }
  }catch(e){}
}
window.addEventListener("visibilitychange", ()=>{ if(document.hidden) save(); });
window.addEventListener("pagehide", save);

let lastTick = performance.now();
function loop(now){
  const dt = (now - lastTick)/1000; lastTick = now;
  const per = cps()*dt;
  if(per > 0) addCookies(per, false);
  render();
  requestAnimationFrame(loop);
}
document.getElementById("reset").addEventListener("click", ()=>{
  if(confirm("Delete your cookies and start over?")){
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    S = { cookies:0, total:0, clicks:0, buildings:{}, tapUpgrades:0, last:Date.now() };
    noteEl.textContent = "";
    buildShop(); render(true);
  }
});

load();
buildShop();
render(true);
requestAnimationFrame(loop);
setInterval(save, 5000);
</script>
</body>
</html>
